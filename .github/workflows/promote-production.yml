name: Promote production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72
      WORKER_NAME: tinkercademy-dot-com
      WORKER_TAG: f71a28eda02e4d47922ba00cb262e3f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve uploaded Worker version for this tag
        id: resolve
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/resolve-worker-version.mjs

      - name: Promote version to 100% traffic
        env:
          VERSION_ID: ${{ steps.resolve.outputs.version_id }}
          GIT_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$VERSION_ID" ]; then
            echo "Resolver did not write version_id; refusing to guess a version." >&2
            exit 1
          fi
          npx --yes wrangler@4.123.0 versions deploy "${VERSION_ID}@100" --yes --message "Promote ${GIT_TAG} (${COMMIT_SHA})"

      # Notify only after promotion, never for upload-only or staging builds.
      - name: Notify IndexNow of production URLs
        id: indexnow
        continue-on-error: true
        run: node scripts/indexnow.mjs --submit

      - name: Report IndexNow failure without rolling back production
        if: steps.indexnow.outcome == 'failure'
        run: echo "::warning::IndexNow notification failed. Production is deployed; inspect the notification log and retry separately."
