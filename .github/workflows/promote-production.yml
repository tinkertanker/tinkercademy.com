name: Promote production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72
      WORKER_NAME: tinkercademy-dot-com
      WORKER_TAG: f71a28eda02e4d47922ba00cb262e3f7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve uploaded Worker version for this tag
        id: resolve
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/resolve-worker-version.mjs

      - name: Promote version to 100% traffic
        env:
          VERSION_ID: ${{ steps.resolve.outputs.version_id }}
          GIT_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$VERSION_ID" ]; then
            echo "Resolver did not write version_id; refusing to guess a version." >&2
            exit 1
          fi
          npx --yes wrangler@4 versions deploy "${VERSION_ID}@100" --yes --message "Promote ${GIT_TAG} (${COMMIT_SHA})"
