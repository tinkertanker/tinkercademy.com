      text: Step 3 -Coding the Micro:bitOn start we have to:Initialize the servo to
        position 180 (Locked Position)Initialize the OLED displayInitialize a
        4×1 arrayInitialize the lockdown counterButton A acts as the enter
        character buttonEvery time you press a key on the 4×4 keypad you have to
        press Button A in order to key in a 4 digit NumberNext, we need to set
        up the micro:bit to detect the key presses!Each key press corresponds to
        a unique analog value from 0 to1023 by using the driver circuitThe
        analog value can be read using the analog read functionThe value in the
        character is stored in the “TempString” variableThe code block is quite
        long,so the download link is provided below.Button B acts as the final
        “Enter” buttonPressing button B causes the program to check if the
        entered string is equal to “369#” using the compare blockif the answer
        is 0 it means that the strings are equal.If it is 1,then the strings are
        not equalThe number of wrong Attempts will increase by 1 every time an
        intruder enters the wrong passwordOnce 3 wrong attempts are detected,the
        program will enter a loop for 60 secondsTo reset the number of attempts
        and the characters entered,press Button A+BThe reset button also resets
        the servo to the “Locked Position”Save your tired fingers and download
        the code
