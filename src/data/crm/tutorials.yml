      text: "Step 10: AssemblyFlash the completed code to your micro:bit (instructions
        here).Attach your micro:bit and the battery pack securely to any object
        and it is ready for use!"
    - type: image
      src: /images/remote/5bbGWnKG79Wysm5aSAbpyxdp4.jpg"http://pages.cs.wisc.edu/~calvin/cs110/RECURSION.html"><a>recursively</a></a>
        will call itself (!) so as to acheive the end goal. I created the
        function plotLight for this reason.  If you have not covered functions,
        go <a
        href="https://tinkercademy.com/tutorials/finger-dexterity-game/tutorials/quick-maths/"><a>here</a></a>.</p></li></ul><ul><li><p>I
        then set two variables randomLightXIndex and randomLightYIndex to
        integers between 0 and 4. This will correspond to the specific LED that
        lights up. Doing this will ensure randomness (<a
        href="https://engineering.mit.edu/engage/ask-an-engineer/can-a-computer-generate-a-truly-random-number/"><a>let
        us not get into the discussion as to where true randomness can really be
        generated</a></a>) of the LED that lights up so the game will be
        different and unpredictable every time.</p></li></ul><ul><li><p>I also
        set the variable bool to true. While this may not be obvious now, it
        will come in handy later (in reality this was a later addition that I
        decided to add after the rest of the function was fleshed out. The
        reason for this will come to light later). This is a common technique in
        coding (especially with while loops)</p></li></ul><ul><li><p>In order to
        increase the difficulty, it was my judgement that a  time variable could
        be useful. We use this later to decrease the pause time betwen one LED
        lighting up and the next. We have set a lower limit for the pause time
        at half a second so as to not make the game impossible. When we call the
        function recursively, the if-statement modifying the pause time is what
        will decrease the pause time everytime the function is
        called.</p></li></ul><ul><li><p>I have created a bunch of if-else
        statements inside a loop. These statements periodically check if a
        button on the keyboard was pressed and if the button corresponds to the
        x-coordinate of the LED that lights up. We have to do this because the
        pressing of the keypad does not emit an event that our event listeners
        in micro:bit’s core modules can respond to (like how it does for shaking
        or button presses). Thus, we had to create our own <a
        href="https://www.computerhope.com/jargon/e/event-listener.htm"><a>event
        listener</a></a>. This event listener only runs as long as bool (which
        we created earlier) is true.</p></li></ul>
      text: To get started, plug in your ADkeypad to Pin0, making sure the positive
        lead is connected to the yellow signal pin and the negative lead is
        connected to the black ground pin on the breakout board. In order for
        the ease of randomisation of the LED that lights up, we will use a
        function recursively. A function used recursively will call itself (!)
        so as to acheive the end goal. I created the function plotLight for this
        reason. If you have not covered functions, go here.I then set two
        variables randomLightXIndex and randomLightYIndex to integers between 0
        and 4. This will correspond to the specific LED that lights up. Doing
        this will ensure randomness (let us not get into the discussion as to
        where true randomness can really be generated) of the LED that lights up
        so the game will be different and unpredictable every time.I also set
        the variable bool to true. While this may not be obvious now, it will
        come in handy later (in reality this was a later addition that I decided
        to add after the rest of the function was fleshed out. The reason for
        this will come to light later). This is a common technique in coding
        (especially with while loops)In order to increase the difficulty, it was
        my judgement that a time variable could be useful. We use this later to
        decrease the pause time betwen one LED lighting up and the next. We have
        set a lower limit for the pause time at half a second so as to not make
        the game impossible. When we call the function recursively, the
        if-statement modifying the pause time is what will decrease the pause
        time everytime the function is called.I have created a bunch of if-else
        statements inside a loop. These statements periodically check if a
        button on the keyboard was pressed and if the button corresponds to the
        x-coordinate of the LED that lights up. We have to do this because the
        pressing of the keypad does not emit an event that our event listeners
        in micro:bit’s core modules can respond to (like how it does for shaking
        or button presses). Thus, we had to create our own event listener. This
        event listener only runs as long as bool (which we created earlier) is
        true.
    - type: image
      src: /images/remote/XjR5KV8HDijMlcVPFd1uHIbOA8.png"https://skillcrush.com/2013/01/17/why-programmers-start-counting-at-zero/"><a>Note
        that we use an index that starts with 0 – this means that the top left
        corner is (0,0)</a></a>)</p></li></ul><ul><li><p>In anticipation of the
        function being called in some point in the future, we decrease the pause
        time so that when that happens the game is more
        difficult.</p></li></ul><ul><li><p>We run our own homemade event
        listener (the name betrays its function – it simply waits for an event
        to happen and acts with our preset code when it does). We use a while
        loop to listen for an event. If it does not find an event in one loop
        the if-else statements inside will not be activated and thus, it will go
        on to the next iteration. When the event does happen (in this case the
        pressing of the key), the if-else statement is activated from its
        slumber and thus, in this rather ingenious way, we have created an event
        listener. (Extension: Browsers listen for events like clicks or keypad
        presses in the same way).</p></li></ul>'
      text: "That was quite a lot for one function! It can be quite a bit for a newbie
        at programming so let me go through that one more time.We use random
        integers between 0 and 4 for the determination of the LED that lights
        up. (Note that we use an index that starts with 0 – this means that the
        top left corner is (0,0))In anticipation of the function being called in
        some point in the future, we decrease the pause time so that when that
        happens the game is more difficult.We run our own homemade event
        listener (the name betrays its function – it simply waits for an event
        to happen and acts with our preset code when it does). We use a while
        loop to listen for an event. If it does not find an event in one loop
        the if-else statements inside will not be activated and thus, it will go
        on to the next iteration. When the event does happen (in this case the
        pressing of the key), the if-else statement is activated from its
        slumber and thus, in this rather ingenious way, we have created an event
        listener. (Extension: Browsers listen for events like clicks or keypad
        presses in the same way)."
    - type: image
      src: /images/remote/CO2stskLNWzntWeYIhJmkSaYo.png"https://stackoverflow.com/questions/9384758/what-is-the-execution-context-in-javascript-exactly"><a>
        execution contexts, which is beyond the scope of this
        tutorial. </a></a></p></li></ul>
      text: Inside each if-else statement, we have decided to end the game if the
        wrong keypad was pressed and tell the player what we think of him/her.If
        the right key was pressed, we immediately go on to the next LED light
        whilst ending the previous while loop or effeciency purposes (just to be
        clear, your code will still work but it’s best not to foster such bad
        habits).Whilst going on to the next LED light, we make use of a concept
        called recursion. To fully understand the inner workings of recursions
        we must be familiar with concepts like execution contexts, which is
        beyond the scope of this tutorial.
    - type: image
      src: /images/remote/UJ5s7BmqY2X4WCD7i5TAkLU04.png"<p><strong>Congratulations!</strong></p><p>You have completed this
