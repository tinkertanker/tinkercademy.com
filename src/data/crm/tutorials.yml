    - type: image
      src: /images/remote/SamneRuaPyP5B9ZZEsrSmNPzI.png"Step 2: Add the Tinker Kit Package"
      html: "<h2>Step 2: Add the Tinker Kit Package</h2><p>We will need to add a
        package to the code editor to enable to use the kit components. Click on
        the advanced in the micro bit text editor and you will see a section
        that says Add Package.</p><p>This will open up a dialog box. Search for
        <strong>Tinker Kit</strong>. Click on the search icon or press enter,
        then select <strong>tinkercademy-tinker-kit</strong>.</p><p>This will
        add two libraries: <strong>Tinkercademy</strong>, for general-purpose
        sensors found in our kit, and <strong>OLED</strong>, for the OLED module
        (ours has a height of 64 and width of 128). We're not using the OLED
        module in this tutorial, but you can!</p>"
      text: "Step 2: Add the Tinker Kit PackageWe will need to add a package to the
        code editor to enable to use the kit components. Click on the advanced
        in the micro bit text editor and you will see a section that says Add
        Package.This will open up a dialog box. Search for Tinker Kit. Click on
        the search icon or press enter, then select tinkercademy-tinker-kit.This
        will add two libraries: Tinkercademy, for general-purpose sensors found
        in our kit, and OLED, for the OLED module (ours has a height of 64 and
        width of 128). We're not using the OLED module in this tutorial, but you
        can!"
    - type: image
      src: /images/remote/9A0fFmizcZLrgMWVHKs2nmbcmp8.png"https://tinkercademy.com/tutorials/getting-started-with-microbit/"><a>our
        introductory tutorial here!</a></a></p></li></ul>
      text: Step 4 – Code it up!If you’ve never tried coding with the micro:bit, check
        out our introductory tutorial here!
    - type: image
      src: /images/remote/RlaZ6H6z9NgNa1Vasw6i4xAJ8Nw.png"https://makecode.microbit.org/_hTm3afgh4F8f"><a>whole code
        here</a></a>! </p></li><li><p>Also – add in more blocks so when the
        dragon gets hit it increases a <em>score</em> variable.</p></li></ul>
      text: Step 7 – Putting it all together.Now we want to be able to stop the dragon
        when it gets hit and also score points!So we should combine the two
        pieces of code and use an IF logic block to check if we got hit. IF we
        get hit, then we change the icon on the micro:bit and pause for a while,
        before changing back to the default icon.ELSE (if we don’t detect and
        hits) then we allow the servo to move as per normal.For the impatient –
        find the whole code here! Also – add in more blocks so when the dragon
        gets hit it increases a score variable.
    - type: image
      src: /images/remote/qBFikrTKyJ3nDjcAoerVLEDQ8lg.png"https://github.com/MrPudin/ureMorse/archive/master.zip"><a>Download
        and extract this project</a></a>.</p></li><li><p>To build the program,
        Micro:Bit runtime program employs the <strong>Yotta</strong> build
        system. First we would target the architecture of Micro:Bit by running
        <strong>yotta target bbc-microbit-classic-gcc.</strong>  We can now
        build the project with <strong>yotta build. </strong>Finally, to install
        the compiled program into your microbit, plug in your Micro:Bit and find
        a file ending with .hex in the build//source/ folder.  Copy this file
        into your Micro:Bit, which should now be mounted.</p></li><li><p>Check
        out module.json where you can configure the program’s name, version,
        description, source code  folder … etc.</p></li><li><p>Now that is quite
        an overwhellming amount of infomation all at once, fortunately what you
        need to do would be much simpler. The author has provided a convience
        makefile to handle building with yotta and installing the compiled file
        into the microbit.</p></li><li><p>To build the project, run
        <strong>make</strong> and to install the compiled program into the
        microbit, run <strong>make install</strong>.  When the
        <em>micro:bit</em> is recieving instruction, the LED on the back of the
        microbit near the USB port would flash. Once installation is complete,
        the LED at the micro-USB port would stop flashing and the program would
        run automatically.</p></li><li><p>To reset the Micro:Bit at any time and
        restart the program running the Micro:Bit, press the button next to the
        micro-USB port on the back of the Micro:Bit</p></li><li><p>For more
        infomation, see the runtime documentation on setting up the development
        enviroment <a
        href="https://lancaster-university.github.io/microbit-docs/offline-toolchains/"><a>here.</a></a></p></li></ul>
      text: Step 1 – Development EnvironmentInstall the dependencies to build your
        microbit project. Using your package manager (brew, apt-get, pacman, …),
        or any method you fancy, install yotta and srecord. Direct your terminal
        to the project directory. Here you will write your code in
        source/main.cpp.Download and extract this project.To build the program,
        Micro:Bit runtime program employs the Yotta build system. First we would
        target the architecture of Micro:Bit by running yotta target
        bbc-microbit-classic-gcc. We can now build the project with yotta build.
        Finally, to install the compiled program into your microbit, plug in
        your Micro:Bit and find a file ending with .hex in the build//source/
        folder. Copy this file into your Micro:Bit, which should now be
        mounted.Check out module.json where you can configure the program’s
        name, version, description, source code folder … etc.Now that is quite
        an overwhellming amount of infomation all at once, fortunately what you
        need to do would be much simpler. The author has provided a convience
        makefile to handle building with yotta and installing the compiled file
        into the microbit.To build the project, run make and to install the
        compiled program into the microbit, run make install. When the micro:bit
        is recieving instruction, the LED on the back of the microbit near the
        USB port would flash. Once installation is complete, the LED at the
        micro-USB port would stop flashing and the program would run
        automatically.To reset the Micro:Bit at any time and restart the program
        running the Micro:Bit, press the button next to the micro-USB port on
        the back of the Micro:BitFor more infomation, see the runtime
        documentation on setting up the development enviroment here.
    - type: image
      src: /images/remote/tiGPrEg8gEvpv9p41Kpe9HsUCdQ.png"https://lancaster-university.github.io/microbit-docs/ubit/"><a><strong>uBit</strong></a></a>“.  
        The first thing any Mirco:bit program should do is initialise the
        Micro:Bit using <a
        href="https://lancaster-university.github.io/microbit-docs/ubit/#init"><a><strong>uBit.init().</strong></a></a></p></li><li><p>Now
        we want the Micro:Bit to scroll “Hello World!” across its screen. This
        is done using <a
        href="https://lancaster-university.github.io/microbit-docs/ubit/display/#scroll"><a><strong>uBit.display.scroll()</strong></a></a>
        which displays its argument scrolling across the display. Note that the
        call blocks while the text is displaying scrolls across the screen.Take
        a look at<a
        href="https://lancaster-university.github.io/microbit-docs/ubit/display/"><a>
        <strong>uBit.display</strong> </a></a>for  more infomation on driving
        the Micro:Bit’s built in display, such  as non blocking
        calls.</p></li><li><p>Thats it, run <strong>make &amp;&amp; make install
        </strong>with your Microbit plugged in to install the program. Once the
        program is installed, “Hello World!” should scroll across the
        screen</p></li></ul>
      text: Step 2 – Hello WorldLets begin by writing the time tested “Hello World”
        program on the microbit. Copy this into main.cpp. As usual, but
        different from the Arduino prototyping platform, code execution starts
        from the main function.First we would include the MicroBit.h to get the
        Mirco:Bit runtime defintions. (The include path would be configured
        automatically by the build system). The Micro:Bit program is centred
        around one object/instance, the MicroBit object, which you will interact
        with do almost every action that involves the microbit. In this
        tutorial, we will name the object “uBit“. The first thing any Mirco:bit
        program should do is initialise the Micro:Bit using uBit.init().Now we
        want the Micro:Bit to scroll “Hello World!” across its screen. This is
        done using uBit.display.scroll() which displays its argument scrolling
        across the display. Note that the call blocks while the text is
        displaying scrolls across the screen.Take a look at uBit.display for
        more infomation on driving the Micro:Bit’s built in display, such as non
        blocking calls.Thats it, run make && make install with your Microbit
        plugged in to install the program. Once the program is installed, “Hello
        World!” should scroll across the screen
    - type: image
      src: /images/remote/6GTpyqYfkxN3lbZ6VEblJaGDcU.png"https://lancaster-university.github.io/microbit-docs/ubit/messageBus/"><a>messageBus </a></a> as
        it to deliver events run registered event handlers when a certain event
        happens, such when one of the buttons on the microbit is pressed, which
        <strong>messageBus</strong> would call the event handler, provided that
        the event meets the handlers listening criteria</p></li><li><p>Use
        <strong>uBit.messageBus.listen() </strong>to register your function as
        an event handler for a speicific event criteria. Here we are registering
        event handlers to the buttons on micro:bit, for any event. This means
        that any event that is related to the specified button would call the
        event handler that was registered for that button. In an actual program,
        we can be more specific like specifing <strong>MICROBIT_EVT_BUTTON_HOLD 
        </strong>to run the event handler only if the specific button is held
        down for some time.</p></li><li><p>Note that <strong>ALL</strong>
        execution would cease if the Micro:Bit reaches the end of
        <strong>main()</strong> function, hence, we release the main thread or
        this case the main “fibre” to allow the micro:bit to process button
        events.</p></li><li><p>Thats it, run it with <strong>make &amp;&amp;
        make install. </strong>Once the program is installed, pressing button(s)
        A and/or B  should scroll “A” or “B” depending on which button you
        press. If you press A and B together, you should see “AB” scrolling
        across the screen.</p></li></ul>
      text: Step 3 – Buttons & EventsWe will employ the two buttons on the Micro:Bit,
        namely button A & B in some combination of clicks & holds to trigger a
        specific functionality.When something happens to the buttons on the
        Micro:Bit, this happening is tranlated into an ‘event’ in to the system.
        Events are not simply limited to button presses. They could represent
        anything from a the radio recieve a datagram or the accelerometer
        detecting a change in orientation.To run code whenever a specific event
        is raised, we write an ‘event handler’, which is simply a function that
        contains the code that you want to run. The function takes in an
        MicroBitEvent argument, which is the event that caused the function to
        be run and returns nothing. Micro:Bit uses messageBus as it to deliver
        events run registered event handlers when a certain event happens, such
        when one of the buttons on the microbit is pressed, which messageBus
        would call the event handler, provided that the event meets the handlers
        listening criteriaUse uBit.messageBus.listen() to register your function
        as an event handler for a speicific event criteria. Here we are
        registering event handlers to the buttons on micro:bit, for any event.
        This means that any event that is related to the specified button would
        call the event handler that was registered for that button. In an actual
        program, we can be more specific like specifing MICROBIT_EVT_BUTTON_HOLD
        to run the event handler only if the specific button is held down for
        some time.Note that ALL execution would cease if the Micro:Bit reaches
        the end of main() function, hence, we release the main thread or this
        case the main “fibre” to allow the micro:bit to process button
        events.Thats it, run it with make && make install. Once the program is
        installed, pressing button(s) A and/or B should scroll “A” or “B”
        depending on which button you press. If you press A and B together, you
        should see “AB” scrolling across the screen.
    - type: image
      src: /images/remote/f7oV875JcIYhyE9PBAGZAUfXDo.png"<h1><strong>Step 6</strong></h1><ul><li><p>Now that we can move our
        player around, let’s start creating our maze levels! Every time we start
        a level we need to do a few things: First we need to display the maze
        walls on the LED display. Second, we need to forever check if the player
        runs into a wall (if they do, it’s gameover!). And third, we need to
        forever check if the player makes it to the end of the maze level (if
        they do, let them know they succeeded and move onto the next
        level!).</p></li></ul><ul><li><p>For each level, we’re going to use a
        forever loop. Inside the loop, we use an ‘if’ statement to check if the
        level variable equals 1. This means this code will only ever run if the
        level variable equals 1.</p></li></ul><ul><li><p>Inside the if
        statement, we first display the maze walls. We light up LEDs to serve as
        maze walls, and leave them turned off to represent the maze path. This
        can be done using the ‘show leds’ block. One thing to be careful about
        though: remember above we set the starting position of the player? Make
        sure your player starting position is not inside a maze wall! In this
        example, the starting position of the player is x=0,
        y=3.</p></li></ul><ul><li><p>Next, we need to check if the player ever
        runs into a wall. How to do this? Once again we’ll use if statments to
        check if our playerx and playery variables are ever in the same place as
        a wall. We do this using the coordinate system of the 5×5 LED grid. In
        this example, there are two sections of
        walls.</p></li></ul><ul><li><p>The first wall exists where playerx is
        less than or equal to 2 AND playery is less than or equal to 2. We
        create an if statement with these conditions, and inside we set gameOn
        to ‘false’ (since if it’s ever ‘true’, it means the player ran into a
        wall and should get a Game Over).</p></li></ul><ul><li><p>The second
        wall exists where playerx equals 4 OR playery equals 4. We create
        another if statement with these conditions, and inside we set gameOn to
        ‘false’ (because once again if it’s ever True, it means the player ran
        into a wall and should get a Game
        Over).</p></li></ul><ul><li><p>Finally, the last test we need to add is
        to see if the player makes it successfully through the maze! In this
        example level, the end of the maze is at x=3, y=0. We create another if
        statment to check if x=3 AND y=0, and inside we do a few things: First,
        we play a success melody in the background. Second, we set the starting
        position of the player for the next level (in this example, we use the
        same starting position, but it can be different!). Third, we show a
        smily face to tell the player they succceeded! And fourth, we change the
        level variable by 1 (this will cause the next level to
        display).</p></li></ul>"
      text: "Step 6Now that we can move our player around, let’s start creating our
        maze levels! Every time we start a level we need to do a few things:
        First we need to display the maze walls on the LED display. Second, we
        need to forever check if the player runs into a wall (if they do, it’s
        gameover!). And third, we need to forever check if the player makes it
        to the end of the maze level (if they do, let them know they succeeded
        and move onto the next level!).For each level, we’re going to use a
        forever loop. Inside the loop, we use an ‘if’ statement to check if the
        level variable equals 1. This means this code will only ever run if the
        level variable equals 1.Inside the if statement, we first display the
        maze walls. We light up LEDs to serve as maze walls, and leave them
        turned off to represent the maze path. This can be done using the ‘show
        leds’ block. One thing to be careful about though: remember above we set
        the starting position of the player? Make sure your player starting
        position is not inside a maze wall! In this example, the starting
        position of the player is x=0, y=3.Next, we need to check if the player
        ever runs into a wall. How to do this? Once again we’ll use if statments
        to check if our playerx and playery variables are ever in the same place
        as a wall. We do this using the coordinate system of the 5×5 LED grid.
        In this example, there are two sections of walls.The first wall exists
        where playerx is less than or equal to 2 AND playery is less than or
        equal to 2. We create an if statement with these conditions, and inside
        we set gameOn to ‘false’ (since if it’s ever ‘true’, it means the player
        ran into a wall and should get a Game Over).The second wall exists where
        playerx equals 4 OR playery equals 4. We create another if statement
        with these conditions, and inside we set gameOn to ‘false’ (because once
        again if it’s ever True, it means the player ran into a wall and should
        get a Game Over).Finally, the last test we need to add is to see if the
        player makes it successfully through the maze! In this example level,
        the end of the maze is at x=3, y=0. We create another if statment to
        check if x=3 AND y=0, and inside we do a few things: First, we play a
        success melody in the background. Second, we set the starting position
        of the player for the next level (in this example, we use the same
        starting position, but it can be different!). Third, we show a smily
        face to tell the player they succceeded! And fourth, we change the level
        variable by 1 (this will cause the next level to display)."
    - type: image
      src: /images/remote/DdFoZd9sfSwBtbQaEEAVapOvvd4.png"<h1><strong>Step 9</strong></h1><ul><li><p>Now our game should be working
        as intended! The only thing missing is more
        levels!</p></li></ul><ul><li><p>It’s quite easy to add more levels by
        duplicating our level 1 code from above. The only things that will
        change are the maze walls and the coordinates for our if statments (for
        testing if the player moves into a wall or completes the
        level.</p></li></ul><ul><li><p>Tip: sometimes it can be complicated to
        create if statements to test for every wall. In these cases, try to
        break down your walls into separate rectangles and create an if
        statement for each rectangle.</p></li></ul><ul><li><p>One thing to watch
        out for: after the player completes the level and you reset their
        playerx and playery variables, make sure the position matches your next
        level. Otherwise they could start inside a wall!</p></li></ul>"
      text: "Step 9Now our game should be working as intended! The only thing missing
        is more levels!It’s quite easy to add more levels by duplicating our
        level 1 code from above. The only things that will change are the maze
        walls and the coordinates for our if statments (for testing if the
        player moves into a wall or completes the level.Tip: sometimes it can be
        complicated to create if statements to test for every wall. In these
