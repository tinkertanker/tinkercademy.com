- id: making-a-waving-fortune-cat
  slug: making-a-waving-fortune-cat
  title: Making a Waving Fortune Cat
  subtitle: >-
    
    Use a micro:bit and mini servo to make your very own Maneki-Neko, or Fortune
    Cat, who waves its hand when you press a button!


    Designed and written by Tim Ho from the National University of Singapore
  description: Make a moving cardboard cat.
  hero_image: /images/remote/pmsl1tHBnpSl79LDhU4ILYgiuVQ.gif"<h2>Goal</h2><ul><li><p>Make a moving cardboard cat.</p></li><li><p>Give
        cat an action which you desire. </p></li><li><p>Hint: Follow the steps
        and pictures during your building process!</p></li></ul>"
      text: "GoalMake a moving cardboard cat.Give cat an action which you desire.
        Hint: Follow the steps and pictures during your building process!"
    - type: richtext
      label: Materials
      html: <h2>Materials</h2><ul><li><p>1 x ADKeypad</p></li><li><p>1 x Battery
        Pack</p></li><li><p>2 x Yellow LED</p></li><li><p>1 x Breakout
        Board</p></li><li><p>1 x micro:bit</p></li><li><p>1 x Mini
        Servo</p></li></ul>
      text: Materials1 x ADKeypad1 x Battery Pack2 x Yellow LED1 x Breakout Board1 x
        micro:bit1 x Mini Servo
    - type: richtext
      label: Step 1 – Choose a cat
      html: <h1><strong>Step 1 – Choose a cat</strong></h1><ul><li><p>Find a cat image
        and stick over a cardboard for support.</p></li><li><p>Choose a cat
        personality of your choice. Happy, relaxed or friendly!</p></li></ul>
      text: Step 1 – Choose a catFind a cat image and stick over a cardboard for
        support.Choose a cat personality of your choice. Happy, relaxed or
        friendly!
    - type: image
      src: /images/remote/8l8e9TpNF14Z9cuK9Bp2hfX95EM.jpg"<h1><strong>Step 6</strong></h1><ul><li><p>Now that we can move our
        player around, let’s start creating our maze levels! Every time we start
        a level we need to do a few things: First we need to display the maze
        walls on the LED display. Second, we need to forever check if the player
        runs into a wall (if they do, it’s gameover!). And third, we need to
        forever check if the player makes it to the end of the maze level (if
        they do, let them know they succeeded and move onto the next
        level!).</p></li></ul><ul><li><p>For each level, we’re going to use a
        forever loop. Inside the loop, we use an ‘if’ statement to check if the
        level variable equals 1. This means this code will only ever run if the
        level variable equals 1.</p></li></ul><ul><li><p>Inside the if
        statement, we first display the maze walls. We light up LEDs to serve as
        maze walls, and leave them turned off to represent the maze path. This
        can be done using the ‘show leds’ block. One thing to be careful about
        though: remember above we set the starting position of the player? Make
        sure your player starting position is not inside a maze wall! In this
        example, the starting position of the player is x=0,
        y=3.</p></li></ul><ul><li><p>Next, we need to check if the player ever
        runs into a wall. How to do this? Once again we’ll use if statments to
        check if our playerx and playery variables are ever in the same place as
        a wall. We do this using the coordinate system of the 5×5 LED grid. In
        this example, there are two sections of
        walls.</p></li></ul><ul><li><p>The first wall exists where playerx is
        less than or equal to 2 AND playery is less than or equal to 2. We
        create an if statement with these conditions, and inside we set gameOn
        to ‘false’ (since if it’s ever ‘true’, it means the player ran into a
        wall and should get a Game Over).</p></li></ul><ul><li><p>The second
        wall exists where playerx equals 4 OR playery equals 4. We create
        another if statement with these conditions, and inside we set gameOn to
        ‘false’ (because once again if it’s ever True, it means the player ran
        into a wall and should get a Game
        Over).</p></li></ul><ul><li><p>Finally, the last test we need to add is
        to see if the player makes it successfully through the maze! In this
        example level, the end of the maze is at x=3, y=0. We create another if
        statment to check if x=3 AND y=0, and inside we do a few things: First,
        we play a success melody in the background. Second, we set the starting
        position of the player for the next level (in this example, we use the
        same starting position, but it can be different!). Third, we show a
        smily face to tell the player they succceeded! And fourth, we change the
        level variable by 1 (this will cause the next level to
        display).</p></li></ul>"
      text: "Step 6Now that we can move our player around, let’s start creating our
        maze levels! Every time we start a level we need to do a few things:
        First we need to display the maze walls on the LED display. Second, we
        need to forever check if the player runs into a wall (if they do, it’s
        gameover!). And third, we need to forever check if the player makes it
        to the end of the maze level (if they do, let them know they succeeded
        and move onto the next level!).For each level, we’re going to use a
        forever loop. Inside the loop, we use an ‘if’ statement to check if the
        level variable equals 1. This means this code will only ever run if the
        level variable equals 1.Inside the if statement, we first display the
        maze walls. We light up LEDs to serve as maze walls, and leave them
        turned off to represent the maze path. This can be done using the ‘show
        leds’ block. One thing to be careful about though: remember above we set
        the starting position of the player? Make sure your player starting
        position is not inside a maze wall! In this example, the starting
        position of the player is x=0, y=3.Next, we need to check if the player
        ever runs into a wall. How to do this? Once again we’ll use if statments
        to check if our playerx and playery variables are ever in the same place
        as a wall. We do this using the coordinate system of the 5×5 LED grid.
        In this example, there are two sections of walls.The first wall exists
        where playerx is less than or equal to 2 AND playery is less than or
        equal to 2. We create an if statement with these conditions, and inside
        we set gameOn to ‘false’ (since if it’s ever ‘true’, it means the player
        ran into a wall and should get a Game Over).The second wall exists where
        playerx equals 4 OR playery equals 4. We create another if statement
        with these conditions, and inside we set gameOn to ‘false’ (because once
        again if it’s ever True, it means the player ran into a wall and should
        get a Game Over).Finally, the last test we need to add is to see if the
        player makes it successfully through the maze! In this example level,
        the end of the maze is at x=3, y=0. We create another if statment to
        check if x=3 AND y=0, and inside we do a few things: First, we play a
        success melody in the background. Second, we set the starting position
        of the player for the next level (in this example, we use the same
        starting position, but it can be different!). Third, we show a smily
        face to tell the player they succceeded! And fourth, we change the level
        variable by 1 (this will cause the next level to display)."
    - type: image
      src: /images/remote/DdFoZd9sfSwBtbQaEEAVapOvvd4.png"<h1><strong>Step 9</strong></h1><ul><li><p>Now our game should be working
        as intended! The only thing missing is more
        levels!</p></li></ul><ul><li><p>It’s quite easy to add more levels by
        duplicating our level 1 code from above. The only things that will
        change are the maze walls and the coordinates for our if statments (for
        testing if the player moves into a wall or completes the
        level.</p></li></ul><ul><li><p>Tip: sometimes it can be complicated to
        create if statements to test for every wall. In these cases, try to
        break down your walls into separate rectangles and create an if
        statement for each rectangle.</p></li></ul><ul><li><p>One thing to watch
        out for: after the player completes the level and you reset their
        playerx and playery variables, make sure the position matches your next
        level. Otherwise they could start inside a wall!</p></li></ul>"
      text: "Step 9Now our game should be working as intended! The only thing missing
        is more levels!It’s quite easy to add more levels by duplicating our
        level 1 code from above. The only things that will change are the maze
        walls and the coordinates for our if statments (for testing if the
        player moves into a wall or completes the level.Tip: sometimes it can be
        complicated to create if statements to test for every wall. In these
        cases, try to break down your walls into separate rectangles and create
        an if statement for each rectangle.One thing to watch out for: after the
        player completes the level and you reset their playerx and playery
        variables, make sure the position matches your next level. Otherwise
        they could start inside a wall!"
    - type: richtext
      label: Step 10
      html: "<h1><strong>Step 10</strong></h1><ul><li><p>Once you’re done adding in
        levels, you can optionally create a victory section. In this example,
        once the player successfully completes the first 3 levels and level
        equals 4, we: unplot the player, play a victory melofy in the
        background, and show a victory message!</p></li></ul>"
      text: "Step 10Once you’re done adding in levels, you can optionally create a
        victory section. In this example, once the player successfully completes
        the first 3 levels and level equals 4, we: unplot the player, play a
        victory melofy in the background, and show a victory message!"
    - type: image
      src: /images/remote/X3VZXb9Wk0Dayxrk3hM1yzT4ODU.png"We’re going to create a full-fledged interactive game on your 5×5
    LED screen, playable for ages 9 days to 90 years old. In the process, you’ll
    learn how to:"
  hero_image: /images/remote/rGRnnPJ7wMBplG84QcB4R7uVR8.png"<h2>Step 1 - Hello World!</h2><p>First step is to import the micro:bit
        library into Python. Then, let a ‘READY’ message scroll across the
        screen and initiate countdown that shows when the game
        starts.</p><ul><li><p>Line 1: This imports the micro:bit
        program</p></li><li><p>Line 4: This initiates the ‘READY’ message that
        scrolls across the screen. Double quotation marks indicate a string (in
        this case ‘READY’)</p></li><li><p>Lines 5-10: This flashes each number
        on the screen for 1 second (or 1000 milliseconds, the measurement
        involved) by using the sleep() function.</p></li><li><p>Line 11: clears
        the screen for us to draw the bird and walls later
        on.</p></li><li><p>Note: It’s always good to add comments to explain
        your own code for others or yourself to understand when coming back to
        it. You add a comment with ‘#’. Also space out your code when necessary
        to indicate different segments that do different
        things.</p></li><li><p>What you’re doing is applying <em>functions</em>
        to the object <em>display</em> such that the LCD screen lights
        up.</p></li><li><p>In Python, you also have the flexibility of slowing
        down the scrolling rate of text in line 4. display.scroll(“READY”, delay
        = 200) scrolls the text twice as fast and display.scroll(“READY”, delay
        = 800) scrolls the text at half the speed. The standard delay setting is
        400. Increasing the value decreases scroll speed and decreasing the
        value increases scroll speed.</p></li><li><p>Congratulations! You
        finished the pre-game message! Next, we have to actually set up the game
        for the user to play.</p></li></ul>"
      text: "Step 1 - Hello World!First step is to import the micro:bit library into
        Python. Then, let a ‘READY’ message scroll across the screen and
        initiate countdown that shows when the game starts.Line 1: This imports
        the micro:bit programLine 4: This initiates the ‘READY’ message that
        scrolls across the screen. Double quotation marks indicate a string (in
        this case ‘READY’)Lines 5-10: This flashes each number on the screen for
        1 second (or 1000 milliseconds, the measurement involved) by using the
        sleep() function.Line 11: clears the screen for us to draw the bird and
        walls later on.Note: It’s always good to add comments to explain your
        own code for others or yourself to understand when coming back to it.
        You add a comment with ‘#’. Also space out your code when necessary to
        indicate different segments that do different things.What you’re doing
        is applying functions to the object display such that the LCD screen
        lights up.In Python, you also have the flexibility of slowing down the
        scrolling rate of text in line 4. display.scroll(“READY”, delay = 200)
        scrolls the text twice as fast and display.scroll(“READY”, delay = 800)
        scrolls the text at half the speed. The standard delay setting is 400.
        Increasing the value decreases scroll speed and decreasing the value
        increases scroll speed.Congratulations! You finished the pre-game
        message! Next, we have to actually set up the game for the user to
        play."
    - type: image
      src: /images/remote/oTfMoC8BmSfdnTJF3DV9fGKek.gif"<h2>Step 2 - Fly, Birdie!</h2><p>Next, we have to create the image of the
        bird. For those who never analysed the game, Flappy Bird only allows the
        bird to move upwards and downwards, and pushes it at a constant speed
        towards the walls. Of course, our screen only has 5 rows of LED so it’s
        quite limited. To make the bird-flapping more realistic, we’ll be
        splitting these 5 segments into 100 different positions. This gives us
        more flexibility when adding speed of descent later on. In this case,
        the top of the screen is position y=0 and the button is position y=99 so
        there are 100 positions. The start position is y=50.</p><ul><li><p>Line
        13: This sets the start position of the bird right in the middle, as y=0
        is the top and y=99 is at the bottom.</p></li><li><p>Line 17: This
        determines the actual position of the bird on screen, since there are
        100 positions and 5 LED rows. Hence, you divide the value stored in
        variable y by 20 so you scale the bird down onto the
        screen</p></li><li><p>Line 18: This displays the bird on the screen
        using the display.set_pixel function, which has 3 parameters: x, y and
        brightness. The x-coordinate is 1 so it will appear in the second
        column. The y-coordinate is presently 2 because we divided 50 by 20 and
        rounded it down. That’s the third row. (Note: Indexes begin at 0 usually
        for computer programming, so you have rows 0-4 from above to below and
        columns 0-4 for left to right.) Brightness can be any integer from 0 to
        9, with 9 being the brightest. In this case, 7 will suffice to avoid
        eye-strain.</p></li><li><p>We add a while loop to tell the micro:bit to
        keep repeating the block of code that is indented. (Python uses
        indentations to separate code.)</p></li><li><p>The sleep code tells the
        micro:bit to run this loop every 20ms so it makes your game far more
        manageable and makes sure your CPU doesn’t work too hard and crash the
        browser, which would otherwise happen.</p></li></ul><p>Game check: At
        this point, a welcome message should appear, then disappear for a bird
        to appear.</p>"
      text: "Step 2 - Fly, Birdie!Next, we have to create the image of the bird. For
        those who never analysed the game, Flappy Bird only allows the bird to
        move upwards and downwards, and pushes it at a constant speed towards
        the walls. Of course, our screen only has 5 rows of LED so it’s quite
        limited. To make the bird-flapping more realistic, we’ll be splitting
        these 5 segments into 100 different positions. This gives us more
        flexibility when adding speed of descent later on. In this case, the top
        of the screen is position y=0 and the button is position y=99 so there
        are 100 positions. The start position is y=50.Line 13: This sets the
        start position of the bird right in the middle, as y=0 is the top and
        y=99 is at the bottom.Line 17: This determines the actual position of
        the bird on screen, since there are 100 positions and 5 LED rows. Hence,
        you divide the value stored in variable y by 20 so you scale the bird
        down onto the screenLine 18: This displays the bird on the screen using
        the display.set_pixel function, which has 3 parameters: x, y and
        brightness. The x-coordinate is 1 so it will appear in the second
        column. The y-coordinate is presently 2 because we divided 50 by 20 and
        rounded it down. That’s the third row. (Note: Indexes begin at 0 usually
        for computer programming, so you have rows 0-4 from above to below and
        columns 0-4 for left to right.) Brightness can be any integer from 0 to
        9, with 9 being the brightest. In this case, 7 will suffice to avoid
        eye-strain.We add a while loop to tell the micro:bit to keep repeating
        the block of code that is indented. (Python uses indentations to
        separate code.)The sleep code tells the micro:bit to run this loop every
        20ms so it makes your game far more manageable and makes sure your CPU
        doesn’t work too hard and crash the browser, which would otherwise
        happen.Game check: At this point, a welcome message should appear, then
        disappear for a bird to appear."
    - type: image
      src: /images/remote/tO4ZN9E4rcjbpERUtuuGi172rWI.png"<h1>Step 3 - Leaving The Nest</h1><p>The previous step only created the
        bird image, but it still can’t move! This is what we will do in the next
        step, by simulating realistic gravity.</p><ul><li><p>Firstly, let’s add
        a new variable ’speed’ right below the y-coordinate.</p><ul><li><p>Shift
        the display.clear() into the while loop such that it no longer just
        clears the welcome message, but also clears the old position of the
        bird, as it runs before the new position is set each
        time</p></li><li><p>Lines 25-29: This sets a new y-coordinate of the
        bird within the borders (max y=99, min y=0), based on the ‘gravity’
        acting at that point.</p></li><li><p>Why place it all in the while loop?
        Well, you want this block to continually update the position of the bird
        every few milliseconds (20 to be exact) so this block will keep
        repeating itself</p></li><li><p>Terminal velocity: to make the motion of
        the bird more realistic, speed reaches a constant rate of 2, but only
        after two iterations of the code whereby speed = 0 becomes speed =2. The
        if function ensures that speed does not increase beyond 2. You can play
        around with this to vary the speed of bird
        descent.</p></li></ul></li></ul>"
      text: "Step 3 - Leaving The NestThe previous step only created the bird image,
        but it still can’t move! This is what we will do in the next step, by
        simulating realistic gravity.Firstly, let’s add a new variable ’speed’
        right below the y-coordinate.Shift the display.clear() into the while
        loop such that it no longer just clears the welcome message, but also
        clears the old position of the bird, as it runs before the new position
        is set each timeLines 25-29: This sets a new y-coordinate of the bird
        within the borders (max y=99, min y=0), based on the ‘gravity’ acting at
        that point.Why place it all in the while loop? Well, you want this block
        to continually update the position of the bird every few milliseconds
        (20 to be exact) so this block will keep repeating itselfTerminal
        velocity: to make the motion of the bird more realistic, speed reaches a
        constant rate of 2, but only after two iterations of the code whereby
        speed = 0 becomes speed =2. The if function ensures that speed does not
        increase beyond 2. You can play around with this to vary the speed of
        bird descent."
    - type: image
      src: /images/remote/Si1PwacxC6rACFZTDLalRpn8wc.png"<h2>Step 4 - Defying Gravity</h2><p>Now, we have to get the bird to hop
        by pressing button A. In this step, we also include a new ‘score’
        variable to track the number of walls that the bird flies past. This can
        be accessed at any point using button B.</p><ul><li><p>To react to
        key-pressing of A, run ‘button_a.was_pressed()’ under an if-loop like in
        line 21. If, during that iteration, the A button was pressed at any
        time, we bring the bird up, reset the falling rate, then let it
        accelerate back down to the ground, giving the falling and flapping
        motion. Change the value of speed on flapping, which is currently -8, to
        see the visual changes to rate of bird’s descent.</p></li><li><p>Add
        variable ‘score = 0’ to set new variable score to 0, underneath the
        speed and y variables. As a coding habit, try to set all your variables
        in one place, above the code that uses it so it’s easier to follow, and
        actually can be inputted for use.</p></li><li><p>Show score when button
        B is pressed by creating an if loop similar to button A.
        display.show(score) shows the score at any point in time. We’ll learn to
        vary and count the score after each wall-passing
        later.</p></li></ul><p>Game check: Welcome message appears, disappears,
        then bird appears that falls down. Press A for it to flap upwards and B
        to check the score, which should remain at 0 right now.</p>"
      text: "Step 4 - Defying GravityNow, we have to get the bird to hop by pressing
        button A. In this step, we also include a new ‘score’ variable to track
        the number of walls that the bird flies past. This can be accessed at
        any point using button B.To react to key-pressing of A, run
        ‘button_a.was_pressed()’ under an if-loop like in line 21. If, during
        that iteration, the A button was pressed at any time, we bring the bird
        up, reset the falling rate, then let it accelerate back down to the
        ground, giving the falling and flapping motion. Change the value of
        speed on flapping, which is currently -8, to see the visual changes to
        rate of bird’s descent.Add variable ‘score = 0’ to set new variable
        score to 0, underneath the speed and y variables. As a coding habit, try
        to set all your variables in one place, above the code that uses it so
        it’s easier to follow, and actually can be inputted for use.Show score
        when button B is pressed by creating an if loop similar to button A.
        display.show(score) shows the score at any point in time. We’ll learn to
        vary and count the score after each wall-passing later.Game check:
        Welcome message appears, disappears, then bird appears that falls down.
        Press A for it to flap upwards and B to check the score, which should
        remain at 0 right now."
    - type: image
      src: /images/remote/cJaqyJu2qodO0IrzcxxFrjISM.png"<h1>Step 5 - Pipe Blaster</h1><p>We’re going to create our first pipe
        using a make_pipe function! Then we’ll assign it to variable i, and show
        pipe within the while loop. I know it’s complicated, but it’ll also be
        the start of owl/our game finally looking
        complete!</p><ul><li><p>Functions are blocks of code that are run
        conveniently under the function name. By calling a function, we can run
        the entire block of code within it. This makes it easier to understand
        what we’re doing at each step. In this case, we’ll name our function
        make_pipe() which runs code to make a new pipe each time. Let’s break
        down what each step of the make_pipe() function does</p></li><li><p>At
        line 19, we define the function using def make_pipe(): – the indented
        blocks beneath make up the function</p></li><li><p>At line 20, a custom
        image is drawn, with the ‘0’ indicating 0 brightness for each
        coordinate, starting from row 1, column 1 then row 1, column 2 and so
        on. This basically lights up the LED of the entire last column with the
        brightness of 4. (You can tweak this as you like. I personally like for
        the bird to be clearly brighter than the wall so you can identify its
        position.)</p></li><li><p>At line 21, we use the random library to call
        a random number between and inclusive of 0 and 3. This means 0, 1, 2 and
        3. We don’t use 4 because we blast two holes, one which is gap+1. If 4
        was selected, we would blast a hole in column 4, row 5. But there’s no
        row 5 so an error is returned.</p></li><li><p>We have to return this
        image so that it can be called as the value of i later
        on.</p></li><li><p>The hole is blasted by setting the LED brightness for
        the gap position and the LED above it to be zero. Pretty cool, eh?
        That’s your first function. Good job!</p></li><li><p>Note: always define
        the functions above the actual code, beneath the variables. This is just
        a convention, but it makes your program readable!</p></li><li><p>Let’s
        assign variable i to the function, as per line 27. Now, in the while
        loop, if we add a display.show(i), the display now shows the pipe (and
        hole) i.</p></li><li><p>Persevere! We’re nearly there. Now, we just have
        to get the wall moving, count scores and react to bird-wall
        collisions.</p></li></ul><p>Game check: Same as step 4, and now there’s
        an unmoving wall with holes! Check earlier steps if something has gone
        afowl.</p>"
      text: "Step 5 - Pipe BlasterWe’re going to create our first pipe using a
        make_pipe function! Then we’ll assign it to variable i, and show pipe
        within the while loop. I know it’s complicated, but it’ll also be the
        start of owl/our game finally looking complete!Functions are blocks of
        code that are run conveniently under the function name. By calling a
        function, we can run the entire block of code within it. This makes it
        easier to understand what we’re doing at each step. In this case, we’ll
        name our function make_pipe() which runs code to make a new pipe each
        time. Let’s break down what each step of the make_pipe() function doesAt
        line 19, we define the function using def make_pipe(): – the indented
        blocks beneath make up the functionAt line 20, a custom image is drawn,
        with the ‘0’ indicating 0 brightness for each coordinate, starting from
        row 1, column 1 then row 1, column 2 and so on. This basically lights up
        the LED of the entire last column with the brightness of 4. (You can
        tweak this as you like. I personally like for the bird to be clearly
        brighter than the wall so you can identify its position.)At line 21, we
        use the random library to call a random number between and inclusive of
        0 and 3. This means 0, 1, 2 and 3. We don’t use 4 because we blast two
        holes, one which is gap+1. If 4 was selected, we would blast a hole in
        column 4, row 5. But there’s no row 5 so an error is returned.We have to
        return this image so that it can be called as the value of i later
        on.The hole is blasted by setting the LED brightness for the gap
        position and the LED above it to be zero. Pretty cool, eh? That’s your
        first function. Good job!Note: always define the functions above the
        actual code, beneath the variables. This is just a convention, but it
        makes your program readable!Let’s assign variable i to the function, as
        per line 27. Now, in the while loop, if we add a display.show(i), the
        display now shows the pipe (and hole) i.Persevere! We’re nearly there.
        Now, we just have to get the wall moving, count scores and react to
        bird-wall collisions.Game check: Same as step 4, and now there’s an
        unmoving wall with holes! Check earlier steps if something has gone
        afowl."
    - type: image
      src: /images/remote/TI8TKzrnsB9vvu2jNreoMCqilLo.png"https://www.python.org/dev/peps/pep-0008/"><a>standard
        rules</a></a> for Python programming. It’ll still work without following
        it, but your code should follow conventions to be
        readable.</p></li></ul>'
      text: "Step 6 - FramerateThis step is where we set up the game constants. Here,
        the frame variable starts at 0, then increases by 1 every 20ms so it
        takes 400ms or 0.4s for the frames variable to increase by 20. Remember
        this, it’ll be easier for the incoming math. These constants aren’t used
        until Step 7, but let’s set them up first.Line 15 just indicates the
        time taken (in ms) for frame to increase by 1, which is added as part of
        the while loop in line 37 (frame += 1). You can change the sleep(20) at
        the bottom of the code to sleep(DELAY) so it corresponds.Line 16 sets
        the time taken for the wall to shift by 1 column. This is currently 0.4s
        or 20 frames.Line 17 sets the time between the occurrence of another
        wall. This is currently 2.0s or 100 frames.Line 18 sets the time between
        the score increasing. This should always be equivalent to the
        FRAMES_PER_NEW_WALL value so that each wall you pass is equivalent to
        one additional score.To make the game harder, you would adjust these
        game constants, perhaps reducing the distance between each new wall for
        more walls (but change FRAMES_PER_SCORE to correspond to it). The game
        is currently set for one wall on the screen at any time, but you can
        definitely make it more chaotic by playing around with the values.Note:
        The game constants are in uppercase, differentiating them from the other
        variables used. These are just standard rules for Python programming.
        It’ll still work without following it, but your code should follow
        conventions to be readable."
    - type: image
      src: /images/remote/cNML8lXdlaAxZbN0jCm7rZneic.png"<h1>Step 7 - Pipe Dreams</h1><p>Here, we will compare the frame value
        with game constants to move the wall left, create a new wall and
        increase the score. This is all within the while loop so it’s checked
        every 20ms. Ready? Let’s go.</p><ul><li><p>At this step, we’ll use the
        modulo sign (%). This provides the remainder when a number is divided by
        another number. So 4 % 2 returns 0 but 4 % 3 returns 3. Here, we’ll use
        it to check that the frame variable is equal to any of the game
        constants.</p></li><li><p>Moving wall left: Look at lines 65-67. This
        means the wall shifts when the frame is equal to 20, 40, 60… since
        they’re divisible by FRAMES_PER_WALL_SHIFT value of 20. You can vary
        this to make the walls move faster and increase the difficulty.
        Currently, the walls move every 0.4s.</p></li><li><p>Creating new wall:
        Look at lines 69-71. Every 100 frames, or 2 seconds, a new pipe is made
        by calling the make_pipe() function for i. This is the constant used to
        create and move the wall.</p></li><li><p>Increasing the score: look at
        lines 73-75. This means that a point is added when the bird travels for
        2 seconds, or 1 wall. This value corresponds with the distance between
        walls so each wall passed is one point.</p></li></ul><p>Game check: The
        game should be almost fully playable, with the welcome message, then the
        bird moving by pressing button A. You can see score with button B.
        There’s gravity acting on the bird so it falls down over time. Then the
        walls created randomly move right past it. Wow, you’re nearly done! Now,
        we just have to react to pipe collisions, ending the game and revealing
        the score when the bird collides with any pipe.</p>"
