- id: morse-code-transmitter
  slug: morse-code-transmitter
  title: Morse Code Transmitter
  subtitle: >-
    Make a simple morse code transmitter using MakeCode, micro:bits, and some
    crocodile clips!


    This tutorial was written by Anahita from the University of California at
    Berkeley, during her summer internship in Singapore.
  description: Connect two micro:Bits together
  hero_image: /images/remote/Im9m2uepC9Q9eON1uPJUCEWzBWM.png"<h1>Step 0 – Preview</h1><ul><li><p>We will be writing two sets of code:
        one for the sending micro:Bit and another for the receiving
        micro:Bit</p></li><li><p>In order for the receiver to know which signal
        is being sent, we will adjust the length of time between when the signal
        turns “on” and “off”</p></li><li><p>That way, we can differentiate the
        two signals by the pause length</p></li></ul>"
      text: "Step 0 – PreviewWe will be writing two sets of code: one for the sending
        micro:Bit and another for the receiving micro:BitIn order for the
        receiver to know which signal is being sent, we will adjust the length
        of time between when the signal turns “on” and “off”That way, we can
        differentiate the two signals by the pause length"
    - type: richtext
      label: Step 1 – Crocodile Clips
      html: <h2>Step 1 – Crocodile Clips</h2><p>We want to send signals from pin 1 of
        the first micro:Bit to pin 2 of the second micro:Bit (and vice
        versa)</p><ul><li><p>Connect:</p><ul><li><p>GND to GND</p></li><li><p>3V
        to 3V</p></li><li><p>Pin 1 to Pin 2</p></li><li><p>Pin 2 to Pin
        1</p></li></ul></li></ul>
      text: Step 1 – Crocodile ClipsWe want to send signals from pin 1 of the first
        micro:Bit to pin 2 of the second micro:Bit (and vice versa)Connect:GND
        to GND3V to 3VPin 1 to Pin 2Pin 2 to Pin 1
    - type: image
      src: /images/remote/rTv1P1HqMkifH4qUFLgx2nesaFI.png"Step 2 – Sender: button A"
      html: "<h1>Step 2 – Sender: button A</h1><p>We want a signal to be sent when the
        A button is pressed. Let’s make this one the “dot”
        signal.</p><ul><li><p>Open up MakeCode and name this file
        “Sender”</p></li><li><p>Drag and drop an <strong>if-then-else
        </strong>block from the <strong>Logic</strong> drawer to the
        <strong>Forever</strong> block</p></li><li><p>From the
        <strong>Input</strong> drawer, attach a <strong>button A is
        pressed</strong> block to the <strong>if
        </strong>section</p></li><li><p>From the <strong>Basic </strong>drawer,
        attach a <strong>show led </strong>block in the <strong>then</strong>
        section to display the “dot” on the sender screen</p></li><li><p>Add a
        <strong>digital write pin</strong> block from the <strong>Pins</strong>
        drawer (under <strong>Advanced</strong>) and set it to
        1</p><ul><li><p>This means the signal will turn “on”</p></li><li><p>Make
        sure to change it to <strong>p1</strong> since that’s where we attached
        the clip</p></li></ul></li><li><p>Add a <strong>pause </strong>block
        from the <strong>Basic</strong> drawer and set it to 230
        ms</p><ul><li><p>This pause will be associated with the “dot”
        signal</p></li></ul></li><li><p>Add another <strong>digital write pin
        </strong>block and set it to 0</p><ul><li><p>This means the signal will
        turn “off”</p></li></ul></li><li><p>Add another <strong>pause
        </strong>for 50 ms just to give it some time</p></li></ul>"
      text: "Step 2 – Sender: button AWe want a signal to be sent when the A button is
        pressed. Let’s make this one the “dot” signal.Open up MakeCode and name
        this file “Sender”Drag and drop an if-then-else block from the Logic
        drawer to the Forever blockFrom the Input drawer, attach a button A is
        pressed block to the if sectionFrom the Basic drawer, attach a show led
        block in the then section to display the “dot” on the sender screenAdd a
        digital write pin block from the Pins drawer (under Advanced) and set it
        to 1This means the signal will turn “on”Make sure to change it to p1
        since that’s where we attached the clipAdd a pause block from the Basic
        drawer and set it to 230 msThis pause will be associated with the “dot”
        signalAdd another digital write pin block and set it to 0This means the
        signal will turn “off”Add another pause for 50 ms just to give it some
        time"
    - type: image
      src: /images/remote/CCm9KLcZAl5jP2xF7l8cpdKqW4.png"Step 3 – Sender: Button B"
      html: "<h2>Step 3 – Sender: Button B</h2><p>We want a “dash” signal to be sent
        when the B button is pressed.</p><ul><li><p>Add an <strong>else
        if</strong> block to the <strong>if-then-else</strong> block from
        earlier</p></li><li><p>Repeat the steps as with Step 2,
        except</p><ul><li><p>Use <strong>button B is
        pressed</strong></p></li><li><p>Display a “dash” in the
        LED</p></li><li><p>Pause for 470 ms</p></li></ul></li><li><p>Add a
        <strong>clear screen </strong>block from <strong>Basic</strong> or an
        icon to the <strong>else</strong> statement</p></li></ul>"
      text: "Step 3 – Sender: Button BWe want a “dash” signal to be sent when the B
        button is pressed.Add an else if block to the if-then-else block from
        earlierRepeat the steps as with Step 2, exceptUse button B is
        pressedDisplay a “dash” in the LEDPause for 470 msAdd a clear screen
        block from Basic or an icon to the else statement"
    - type: image
      src: /images/remote/gEbq5cSxQBdcA3sKYdDyrAUWCZs.png"Step 4 – Receiver: detecting the signal"
      html: "<h1>Step 4 – Receiver: detecting the signal</h1><p>We want to record the
        duration of time between whenever the signal is received and when it
        stops. We will be using the <strong>running time (ms)</strong> block for
        this.</p><ul><li><p>Create another project on MakeCode called
        “Receiver”</p></li><li><p>Drag a <strong>while </strong>loop from the
        <strong>Loops </strong>drawer</p></li><li><p>From the <strong>Logic
        </strong>drawer, attach an <strong>equals </strong>sign block to the
        <strong>while </strong>loop</p></li><li><p>Attach a <strong>digital read
        pin</strong> block to the <strong>equals</strong> sign block and set it
        equal to 1</p><ul><li><p>This means that a signal is being
        detected</p></li><li><p>Make sure to change it to <strong>p2
        </strong>since that’s where the crocodile clip
        is</p></li></ul></li><li><p>In the <strong>Variables</strong> drawer,
        make a variable called “keyDownTime”</p></li><li><p>Attach an
        <strong>if-then </strong>block to the body of the <strong>while</strong>
        loop</p></li><li><p>Attach a <strong>not</strong> block from the
        <strong>Logic</strong> drawer to the <strong>if </strong>statement and
        then attach the <strong>keyDownTime</strong> variable to
        it</p></li><li><p>Drag and drop a <strong>set variable to </strong>block
        to the body of the <strong>if-then</strong> block and change the
        variable to <strong>keyDownTime</strong> and attach the <strong>running
        time (ms)</strong> block to it</p><ul><li><p>You can find the
        <strong>running time (ms) </strong>block by searching for it in the
        search bar</p></li></ul></li></ul>"
      text: "Step 4 – Receiver: detecting the signalWe want to record the duration of
        time between whenever the signal is received and when it stops. We will
        be using the running time (ms) block for this.Create another project on
        MakeCode called “Receiver”Drag a while loop from the Loops drawerFrom
        the Logic drawer, attach an equals sign block to the while loopAttach a
        digital read pin block to the equals sign block and set it equal to
        1This means that a signal is being detectedMake sure to change it to p2
        since that’s where the crocodile clip isIn the Variables drawer, make a
        variable called “keyDownTime”Attach an if-then block to the body of the
        while loopAttach a not block from the Logic drawer to the if statement
        and then attach the keyDownTime variable to itDrag and drop a set
        variable to block to the body of the if-then block and change the
        variable to keyDownTime and attach the running time (ms) block to itYou
        can find the running time (ms) block by searching for it in the search
        bar"
    - type: image
      src: /images/remote/QBsuhZgn5Kzwfg0ISo4OpU8vUk.png"Step 5 – Receiver: displaying the signal"
      html: "<h2>Step 5 – Receiver: displaying the signal</h2><p>We want to display
        the correct signal on the screen.</p><ul><li><p>Drag and drop an
        <strong>if-then </strong>block underneath the while loop and attach the
        <strong>keyDownTime</strong> variable to it</p><ul><li><p>This is so
        that this block of code will only run if a signal has been
        detected</p></li></ul></li><li><p>Create another variable called
        “duration” and set it to be the difference between <strong>running
        time</strong> and <strong>keyDownTime</strong></p><ul><li><p>The
        <strong>minus</strong> operation is under the <strong>Math
        </strong>drawer</p></li><li><p>This variable tells us how long it’s been
        since the program started running and when the signal was
        detected</p></li></ul></li><li><p>Drag an <strong>if-then </strong>block
        and attach a <strong>less than</strong> block from the <strong>Logic
        </strong>drawer and make it so that it’s <strong>duration</strong> &lt;
        250</p><ul><li><p>We chose 250 ms since the “dot” takes 230
        ms</p></li></ul></li><li><p>Display the “dot” led in the body of the if
        statement</p></li><li><p>Add an <strong>else if</strong> block to the
        <strong>if-then-else</strong> block from earlier and do the same thing
        as above except the “dash” threshold is 500 since the “dash” takes 470
        ms and then show the “dash” led</p></li><li><p>Add a <strong>clear
        screen </strong>so that the screen clear after a signal comes
        in</p></li><li><p>After the first <strong>if-then</strong> block make
        sure to set <strong>keyDownTime</strong> to 0 so that it works every
        time you send a new signal</p></li></ul>"
      text: "Step 5 – Receiver: displaying the signalWe want to display the correct
        signal on the screen.Drag and drop an if-then block underneath the while
        loop and attach the keyDownTime variable to itThis is so that this block
        of code will only run if a signal has been detectedCreate another
        variable called “duration” and set it to be the difference between
        running time and keyDownTimeThe minus operation is under the Math
        drawerThis variable tells us how long it’s been since the program
        started running and when the signal was detectedDrag an if-then block
        and attach a less than block from the Logic drawer and make it so that
        it’s duration < 250We chose 250 ms since the “dot” takes 230 msDisplay
        the “dot” led in the body of the if statementAdd an else if block to the
        if-then-else block from earlier and do the same thing as above except
        the “dash” threshold is 500 since the “dash” takes 470 ms and then show
        the “dash” ledAdd a clear screen so that the screen clear after a signal
        comes inAfter the first if-then block make sure to set keyDownTime to 0
        so that it works every time you send a new signal"
    - type: image
      src: /images/remote/G54S7Y7JBItWSbSUXRMFottypIE.png"Step 1:"
      html: <h1>Step 1:</h1><p>Firstly, plug in your buzzer to Pin 0, making sure the
        positive side (usually the longer end) is connected to the yellow signal
        pin and the negative end is connected to the black ground  pin on the
        breakout board.</p><p>Plug in the ADKeypad to Pin 1, making sure that
        the colour of the wire and breakout board matches. Then, attach the OLED
        screen at the bottom left socket of the breakout board.</p>
      text: Step 1:Firstly, plug in your buzzer to Pin 0, making sure the positive
        side (usually the longer end) is connected to the yellow signal pin and
        the negative end is connected to the black ground pin on the breakout
        board.Plug in the ADKeypad to Pin 1, making sure that the colour of the
        wire and breakout board matches. Then, attach the OLED screen at the
        bottom left socket of the breakout board.
    - type: richtext
      label: "Step 2:"
      html: <h1>Step 2:</h1><p>We will need to add a package to the code editor to
        enable to use the kit components. Click on the advanced in the micro bit
        text editor and you will see a section that says Add Package.</p><p>This
        will open up a dialog box. Search for OLED. Click on the search icon or
        press enter, then select the
        oled-ssd1306.</p><p><strong>Note:</strong> If you get a warning telling
        you some packages will be removed because of incompatibility issues,
        either follow the prompts or create a new project in the  Projects file
        menu.</p>
      text: "Step 2:We will need to add a package to the code editor to enable to use
        the kit components. Click on the advanced in the micro bit text editor
        and you will see a section that says Add Package.This will open up a
        dialog box. Search for OLED. Click on the search icon or press enter,
        then select the oled-ssd1306.Note: If you get a warning telling you some
        packages will be removed because of incompatibility issues, either
        follow the prompts or create a new project in the Projects file menu."
    - type: image
      src: /images/remote/CgClkqD8Wq0hwjYJxlwwEMsPZLI.png"Step 3:"
      html: <h1>Step 3:</h1><p>First, you have to initialise the OLED screen to a
        width of 64 and length of 128 so to run the screen in the proper
        sizing.</p><p>Next, you have to set a variable starting score to 0 for
        the initial play. This means you have a score of 0 at the start of your
        game. Then you need to OLED display show a text of “Pitch
        Perfect”.</p><p>You need to write a simple instruction on how to start.
        Thus, a simple sentence “Press A to start ” will do.</p>
      text: Step 3:First, you have to initialise the OLED screen to a width of 64 and
        length of 128 so to run the screen in the proper sizing.Next, you have
        to set a variable starting score to 0 for the initial play. This means
        you have a score of 0 at the start of your game. Then you need to OLED
        display show a text of “Pitch Perfect”.You need to write a simple
        instruction on how to start. Thus, a simple sentence “Press A to start ”
        will do.
    - type: image
      src: /images/remote/nJoKYioLDzmZKqyWwAN2wgNZp1s.png"Step 4:"
      html: "<h1>Step 4:</h1><p>Since at step 3 we wrote that you need to press A to
        start, we need to write a condition for it. A condition basically means
        a requirement for a program to start loading its instructions. Thus, an
        if else statement of the A button being pressed would suffice. Moreover,
        this will be nested on a forever bracket.</p><p>Next, you have to write
        another set of instructions on how to play the game. What I wrote was :
        “You have guess which pitch it is by pressing the correct key”. Then you
        have to have a timeout around 5000ms (5 seconds) to let the user read
        the instructions.</p>"
      text: "Step 4:Since at step 3 we wrote that you need to press A to start, we
        need to write a condition for it. A condition basically means a
        requirement for a program to start loading its instructions. Thus, an if
        else statement of the A button being pressed would suffice. Moreover,
        this will be nested on a forever bracket.Next, you have to write another
        set of instructions on how to play the game. What I wrote was : “You
        have guess which pitch it is by pressing the correct key”. Then you have
        to have a timeout around 5000ms (5 seconds) to let the user read the
        instructions."
    - type: image
      src: /images/remote/pDNrj03Uvqxf1vaswmMsXZrJU.png"Step 5:"
      html: "<h1>Step 5:</h1><p>You are gonna introduce the user to listen to the
        pitch of the sound being played. What I did was to play the pitch (for
        example: C) for 4 beat (4 seconds), flash the led on the MicroBit of the
        pitch C and OLED display on the screen itself.</p><p>After that, I will
        put in a timeout so the user can process the pitch to the correct
        alphabet and the ADKeyboard. Additionally, you can put in the OLED
        screen on what buttons are to be pressed for a certain pitch. Example,
        when Pitch C is being played, I wrote “Left blue button” to indicate
        that is the button.</p><p>If you are wondering, why the intialise OLED
        display and show string block is repeated, it is because it would
        simulate a refresh in web browser. If you do not initalise the display,
        the text would just be brought down instead of new text being
        created.</p>"
      text: "Step 5:You are gonna introduce the user to listen to the pitch of the
        sound being played. What I did was to play the pitch (for example: C)
        for 4 beat (4 seconds), flash the led on the MicroBit of the pitch C and
        OLED display on the screen itself.After that, I will put in a timeout so
        the user can process the pitch to the correct alphabet and the
        ADKeyboard. Additionally, you can put in the OLED screen on what buttons
        are to be pressed for a certain pitch. Example, when Pitch C is being
        played, I wrote “Left blue button” to indicate that is the button.If you
        are wondering, why the intialise OLED display and show string block is
        repeated, it is because it would simulate a refresh in web browser. If
        you do not initalise the display, the text would just be brought down
        instead of new text being created."
    - type: image
      src: /images/remote/MW6LAd7NurDhQM8DXd9DgsBVk.png"Step 6:"
      html: "<h1>Step 6:</h1><p>Once the user have gone through the mini-briefing of
        how the pitch sounds, you can get them ready. You can have a countdown
        for them to get ready on the game itself.</p><p>Now, you can build your
        pitch tests. So, to do that, you need to play a pitch and you can
        customise by displaying by any image on the MicroBit and a message “Key
        #1” at the same time.</p><p>Then, if the user pressed the correct button
        on the ADKeypad, they would get a point. If not, no points. Thus you set
        the variable score to change by 1 if the get it correct and otherwise, a
        -1. Thus, an if-else statement on whether the user pressed the correct
        button will do.</p><p>To let the user know if they got the correct
        answer, you can display of an image tick for a correct answer and a
        cross for a wrong answer.</p><p>Repeat this step so you can have many
        tests to play with!</p>"
      text: "Step 6:Once the user have gone through the mini-briefing of how the pitch
        sounds, you can get them ready. You can have a countdown for them to get
        ready on the game itself.Now, you can build your pitch tests. So, to do
