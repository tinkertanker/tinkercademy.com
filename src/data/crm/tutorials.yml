    - type: richtext
      label: "Project 01: Music Machine"
      html: "<h1><strong>Project 01: Music Machine</strong></h1><h3><strong>Pin
        Layout</strong></h3><ul><li><p>Buzzer: Pin0</p></li><li><p>ADKeypad:
        Pin2</p></li></ul><h2> </h2><h3><strong>Small note about the
        ADKeypad</strong></h3><p>The ADKeypad returns an analog signal when its
        buttons are pressed. Each button pressed would return a unique integer
        value ranging from 0 (meaning 0V) to 1023 (meaning 3V). </p><p>However,
        it is not uncommon that each button would give a small range of values
        when pressed at different times and different ADKeypads might give
        different signals yet again. Hence, in this example code, we provide a
        range of possible values that your ADKeypad’s buttons are likely to
        return when pressed. </p><p>Feel free to test out the values that your
        ADKeypad might return when pressed and change the values in the example
        code 🙂</p>"
