    - type: image
      src: /images/remote/1xc3FItBakESuhI1fzJCI7cTX1M.png"<h1><strong>Step 5 – Move</strong></h1><p>the snake and figure out what
        happens next.</p><p>The whole code should be placed on top of the
        previous display code. (See completed code for reference). The first
        line determines the next pixel the snake will move to. Based on the
        current location of the head of the snake and adding the direction (in
        terms of row and column), we can find the next pixel. By obtaining the
        modulo 5, we can wrap the snake around the edge of the board.</p><p>What
        happens if this next block is already occupied by the body of the snake?
        In this case, a collision happens and the game ends. Note that break
        stops the while: True loop from running.</p><p>The next block is now
        made the new head of the snake. Next, we check if a piece of food has
        been eaten. If so, then a new piece of food should be generated. If not,
        the tail of the snake should removed so that the snake is moving, not
        simply growing longer.</p>"
      text: "Step 5 – Movethe snake and figure out what happens next.The whole code
        should be placed on top of the previous display code. (See completed
        code for reference). The first line determines the next pixel the snake
        will move to. Based on the current location of the head of the snake and
        adding the direction (in terms of row and column), we can find the next
        pixel. By obtaining the modulo 5, we can wrap the snake around the edge
        of the board.What happens if this next block is already occupied by the
        body of the snake? In this case, a collision happens and the game ends.
        Note that break stops the while: True loop from running.The next block
        is now made the new head of the snake. Next, we check if a piece of food
        has been eaten. If so, then a new piece of food should be generated. If
        not, the tail of the snake should removed so that the snake is moving,
        not simply growing longer."
