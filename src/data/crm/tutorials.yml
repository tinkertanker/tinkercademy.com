    - type: image
      src: /images/remote/ciEeVVKad5A0gNqTKqHhHVvFVBE.png"Bonus loading effects:"
      html: "<h2>Bonus loading effects:</h2><ul><li><p>This one utilizes the light
        sensor and the LED to start the game.</p></li><li><p>It detects light
        and once the light is covered, the game will start.</p></li></ul><p>This
        next animation is simple: display the characters “3”, “2” , and “1”, as
        a countdown before starting the game. The code is pretty self
