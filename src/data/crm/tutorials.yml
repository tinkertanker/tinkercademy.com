        any image on the MicroBit and a message “Key #1” at the same time.Then,
        if the user pressed the correct button on the ADKeypad, they would get a
        point. If not, no points. Thus you set the variable score to change by 1
        if the get it correct and otherwise, a -1. Thus, an if-else statement on
        whether the user pressed the correct button will do.To let the user know
        if they got the correct answer, you can display of an image tick for a
        correct answer and a cross for a wrong answer.Repeat this step so you
        can have many tests to play with!"
    - type: image
      src: /images/remote/9Vdt33oJUx2qSruXlu1mkfKGw.png"Step 7:"
      html: <h1>Step 7:</h1><p>Once you are contempted with your tests, you can end
        the game by showing the latest scores. You can display in the OLED
        screen “Your score is:” with the variable score shown. Put a smiley for
        fun sake.</p><p>And you are done! Enjoy the game.</p><p><a
