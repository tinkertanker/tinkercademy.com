- id: put-together-the-krazy-kar-v2
  slug: put-together-the-krazy-kar-v2
  title: Put together the Krazy Kar v2
  subtitle: >-
    Got our Krazy Kar Kit and ready to get started? Follow along to put it
    together here.

    Don’t like instructions? Use your creativity and make a krazy octopus
    instead.
  description: Make the Krazy Kar.
  hero_image: /images/remote/bDXq6Ap8j8OhUNkbZXwvrKiw18w.png"https://tinkercademy.com/tutorials/make-a-microbit-car/"
        target="_blank" rel="noopener noreferrer"><a>our tutorial
        here</a></a>!</p>
      text: Step 3 – On to the Outside!Using the 5 screws, fit the micro+basic:bit
        cyborg into the 5 holes on the top of the krazy kar.Decorate decadently.
        And code it to get moving! If you’ve used a continuous servo with your
        micro:bit before – try coding this kar yourself!Otherwise, get some help
        from our tutorial here!
    - type: image
      src: /images/remote/rWnIUHz2MF1GPSFfsUlDHtdmY.jpg"Step 4: Coding randomiser function"
      html: "<h1><strong>Step 4: Coding randomiser function</strong></h1><p>In this
        step, we will be randomising the questions that will be displayed.<br
        />Firstly, create a variable named answer. In this, we will store
        whether the answer should be true or false. We determine this by using
        the randomiser block under Math.</p><p>Next, we create 3 more variables
        – i1, i2 and a.<br />i1 + i2 = a this is an example of what these
        variables would be used for.<br />We then assign a random value from 1
        to 9 to i1 and i2. The value of a would be set later.</p><p>After this,
        we create a variable name type, which will be used to store what type of
        question this is. (0: Addition, 1: Subtraction, 2: Multiplication, 3:
        Division)<br />type would then be given a random number from 0 to 3
        using the block under math.<br />From here, there is an if-else
        statement that checks what type of question it is in order to generate
        an answer.</p><p>For Addition (0), if the answer for this is supposed to
        be true, we set a to the sum of i1 and i2. However, if this is supposed
        be false, we add 1 to correct answer.</p><p>For Subtraction (1), if the
        answer for this is supposed to be true, we set a to the sum of i1 and
        i2, afterwards we swap the values of a and i1. However, if this is
        supposed be false, we add 1 to i1.</p><p>For Multiplication (2), if the
        answer for this is supposed to be true, we set a to the product of i1
        and i2. However, if this is supposed be false, we add 1 to correct
        answer.</p><p>For Division (3), if the answer for this is supposed to be
        true, we set a to the product of i1 and i2, afterwards we swap the
        values of a and i1. However, if this is supposed be false, we add 1 to
        i1.</p>"
      text: "Step 4: Coding randomiser functionIn this step, we will be randomising
        the questions that will be displayed.Firstly, create a variable named
        answer. In this, we will store whether the answer should be true or
        false. We determine this by using the randomiser block under Math.Next,
        we create 3 more variables – i1, i2 and a.i1 + i2 = a this is an example
        of what these variables would be used for.We then assign a random value
        from 1 to 9 to i1 and i2. The value of a would be set later.After this,
        we create a variable name type, which will be used to store what type of
        question this is. (0: Addition, 1: Subtraction, 2: Multiplication, 3:
        Division)type would then be given a random number from 0 to 3 using the
        block under math.From here, there is an if-else statement that checks
        what type of question it is in order to generate an answer.For Addition
        (0), if the answer for this is supposed to be true, we set a to the sum
        of i1 and i2. However, if this is supposed be false, we add 1 to correct
        answer.For Subtraction (1), if the answer for this is supposed to be
        true, we set a to the sum of i1 and i2, afterwards we swap the values of
        a and i1. However, if this is supposed be false, we add 1 to i1.For
        Multiplication (2), if the answer for this is supposed to be true, we
        set a to the product of i1 and i2. However, if this is supposed be
        false, we add 1 to correct answer.For Division (3), if the answer for
        this is supposed to be true, we set a to the product of i1 and i2,
        afterwards we swap the values of a and i1. However, if this is supposed
        be false, we add 1 to i1."
    - type: image
      src: /images/remote/NdkOTYg1aCviqtVkpIkgMFfa1Y.png"Step 5: Coding Display function"
      html: "<h1><strong>Step 5: Coding Display function</strong></h1><p>In this step,
        we will be creating a function that displays the question onto the
        screen.<br />First, initialise the OLED as shown in the picture.<br
        />Next, we want to determine what sign to use thus create a variable
        named sign.<br />Afterwards set what the value of sign is by using an if
        else statement that checks what type of question it is.<br />(0: +, 1:
        -, 2: x, 3: /)<br />Now that we have that we would want to display the
        equation.<br />Under the OLED section, select the show string block and
        add the variables i1, sign, i2.<br />Now that the display function is
        done, call the function at the end of the randomise function, as you
        would want the question to be displayed after the values have been
        randomised.</p>"
      text: "Step 5: Coding Display functionIn this step, we will be creating a
        function that displays the question onto the screen.First, initialise
        the OLED as shown in the picture.Next, we want to determine what sign to
        use thus create a variable named sign.Afterwards set what the value of
        sign is by using an if else statement that checks what type of question
        it is.(0: +, 1: -, 2: x, 3: /)Now that we have that we would want to
        display the equation.Under the OLED section, select the show string
        block and add the variables i1, sign, i2.Now that the display function
        is done, call the function at the end of the randomise function, as you
        would want the question to be displayed after the values have been
        randomised."
    - type: image
      src: /images/remote/8NBneMNAa5wQqlDuwQQZA1Mg8.png"Step 6: Coding the start action."
      html: "<h1><strong>Step 6: Coding the start action.</strong></h1><p>Now that we
        can randomise the questions it is time we start the game.<br />Firstly,
        create a start function. In this function, set the started value to true
        and call the randomise function. Afterwards, from the game section in
        advanced, add the set score block and set the value to 0.<br />Now that
        the function is complete, add the 2 button pressed blocks under the
        input section for both buttons A and B. In both blocks, create an if
        else statement to check if the game has not started and if it hasn’t
        call function start.</p>"
      text: "Step 6: Coding the start action.Now that we can randomise the questions
        it is time we start the game.Firstly, create a start function. In this
        function, set the started value to true and call the randomise function.
        Afterwards, from the game section in advanced, add the set score block
        and set the value to 0.Now that the function is complete, add the 2
        button pressed blocks under the input section for both buttons A and B.
        In both blocks, create an if else statement to check if the game has not
        started and if it hasn’t call function start."
    - type: image
      src: /images/remote/EcAWfVVqsrRoBbvurLV0WElt3gU.png"Step 7: Coding check function"
      html: "<h1><strong>Step 7: Coding check function</strong></h1><p>Continuing from
        step 6, now we will be working on the part if the game has
        started.</p><p>Firstly, create 2 functions – correct and wrong. In the
        correct function, select the change score block from under the game
        section and change the score by 1. Next call the randomise function to
        get the next question and lastly start melody ba ding that repeats once
        for additional sound effects.</p><p>Moving on to the wrong function,
        start melody wawawawaa repeating once and show icon X to indicate that
        the player has chosen the wrong answer. Afterwards, initialise OLED as
        shown in image.<br />Lastly, we want to check the high score. Start off
        by creating a high score variable. Next create an if else statement as
        shown above, in this logic gate we are checking if the score is higher
        than the player’s high score if it is then the high score value will be
        set to the current score.<br />Not to forget, set the started variable
        to false as the game has ended.<br />Now that we have completed the
        correct and wrong functions, we need to call them as shown in the
        image.</p>"
      text: "Step 7: Coding check functionContinuing from step 6, now we will be
        working on the part if the game has started.Firstly, create 2 functions
        – correct and wrong. In the correct function, select the change score
        block from under the game section and change the score by 1. Next call
        the randomise function to get the next question and lastly start melody
        ba ding that repeats once for additional sound effects.Moving on to the
        wrong function, start melody wawawawaa repeating once and show icon X to
        indicate that the player has chosen the wrong answer. Afterwards,
        initialise OLED as shown in image.Lastly, we want to check the high
        score. Start off by creating a high score variable. Next create an if
        else statement as shown above, in this logic gate we are checking if the
        score is higher than the player’s high score if it is then the high
        score value will be set to the current score.Not to forget, set the
        started variable to false as the game has ended.Now that we have
        completed the correct and wrong functions, we need to call them as shown
        in the image."
    - type: image
      src: /images/remote/1K3r4Yn1wQUL2X7dBiPdqIRtdUY.png"Bonus step 8:"
      html: "<h1><strong>Bonus step 8: </strong></h1><p>Coding timerBy now you have a
        functioning game, but to make things most exciting we should add a
        timer. But before we dive into that there are a few things we have to do
        first.</p><ul><li><p>Firstly, create an end function. In the function
        set up accordingly. This may seem familiar as this is the last part of
        the wrong function, you can replace that portion by calling this
        function. This function would be called again thus to prevent needing to
        reprogram it we can just call the function.</p></li><li><p>Next, create
        a slow function this would be called if the player does not answer in
        time. Create the blocks as shown in the image.</p></li><li><p>Following
        that, we have to create a new variable called time. Time stores when the
        player started a specific question. Afterwards, set its value to the
        running time (ms) block which can be found under the more tab of the
        input section.</p></li><li><p>Micro:bit does not have a built-in timer
        thus we would have to design one on our own by using what they offer.
        Now we know that time is when the player started the question, and
        running time is how long the program has been running, thus from this if
        we subtract them we get how long the player has spent on that question.
        For this game we only allow the player to have 2.5s (2500ms) for each
        question. Hence, they will lose if they are too
        slow.</p></li><li><p>Lastly, in the correct function add a block that
        sets the value of time to current running time. This is to refresh the
        starting time for a new question.</p></li></ul>"
      text: "Bonus step 8: Coding timerBy now you have a functioning game, but to make
        things most exciting we should add a timer. But before we dive into that
        there are a few things we have to do first.Firstly, create an end
        function. In the function set up accordingly. This may seem familiar as
        this is the last part of the wrong function, you can replace that
        portion by calling this function. This function would be called again
        thus to prevent needing to reprogram it we can just call the
        function.Next, create a slow function this would be called if the player
        does not answer in time. Create the blocks as shown in the
        image.Following that, we have to create a new variable called time. Time
        stores when the player started a specific question. Afterwards, set its
        value to the running time (ms) block which can be found under the more
        tab of the input section.Micro:bit does not have a built-in timer thus
        we would have to design one on our own by using what they offer. Now we
        know that time is when the player started the question, and running time
        is how long the program has been running, thus from this if we subtract
        them we get how long the player has spent on that question. For this
        game we only allow the player to have 2.5s (2500ms) for each question.
        Hence, they will lose if they are too slow.Lastly, in the correct
        function add a block that sets the value of time to current running
        time. This is to refresh the starting time for a new question."
    - type: image
      src: /images/remote/3yRYhM7SJbDUMgNuzhiVLvXkfg.png"https://makecode.microbit.org/42973-83238-85843-19119"
        target="_blank" rel="noopener noreferrer"><a>Click here for the full
        project</a></a></h2>
      text: That’s it! You’ve officially completed this tutorial.Click here for the
        full project
- id: reaction-time-tester
  slug: reaction-time-tester
  title: Reaction Time Tester
  subtitle: Test yourself with this Python-based mini-game for the micro:bit and
    OLED! Written by Jensen from Raffles Institution.
  description: Assemble a reaction time tester.
  hero_image: /images/remote/ezqHf467E8H5lw75OZV4QKr5b6w.jpg"https://gethacking.com/products/micro-bit-tinker-kit)"><a>Tinker
        Kit</a></a> (or OLED display)</p></li><li><p>1 x Brain</p></li><li><p>1
        x You</p></li></ul>
      text: Materials1 x Tinker Kit (or OLED display)1 x Brain1 x You
    - type: richtext
      label: Step 1 – Input/Output
      html: <h1>Step 1 – Input/Output</h1><ul><li><p>Attach the MicroBit to the
        Breakout Board.</p></li><li><p>Connect the LED to pin 12, which is a
        digital pin.</p></li><li><p>Connect the light detector to pin 8, another
        digital pin.</p></li><li><p>Brown to G (ground), red to V (voltage) and
        orange to S (signal).</p></li><li><p>These tell us if light is on or
        off.</p></li><li><p>Connect the OLED display to the I^2C pins. Any one
        set will do.</p></li><li><p>Connect your micro:bit to the computer, and
        download the Mu Editor.</p></li></ul>
      text: Step 1 – Input/OutputAttach the MicroBit to the Breakout Board.Connect the
        LED to pin 12, which is a digital pin.Connect the light detector to pin
        8, another digital pin.Brown to G (ground), red to V (voltage) and
        orange to S (signal).These tell us if light is on or off.Connect the
        OLED display to the I^2C pins. Any one set will do.Connect your
        micro:bit to the computer, and download the Mu Editor.
    - type: image
      src: /images/remote/zBTCW1uldcKiCKaTRJ5dJt9ijUk.jpg"https://github.com/fizban99/microbit_ssd1306"><a>This
        link</a></a>, download the module as a zip file.</p></li><li><p>Write
        the code (first screenshot)  in Mu Editor to import the
        files.</p></li><li><p>Be sure to have the files in the same folder as
        the project.</p></li><li><p>Transfer a few of the files from your
        computer to the microbit.</p></li><li><p>On Windows, be sure to put the
        files in a folder under users/”Username”/mu-code for them to be detected
        my mu-editor</p></li><li><p>These files are the modules that are not
        originally present on the micro:bit for you to import.</p></li></ul>
