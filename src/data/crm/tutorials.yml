        code into separate portions,  each aspect of the game can be tested
        individually to ensure that they are all functioning as they
        should.</p><ol><li><p>Import libraries</p></li><li><p>Initialize
        variables</p></li><li><p>Create the main loop</p></li><li><p>Display
        snake and food</p></li><li><p>Move snake every frame</p></li><li><p>Set
        win and game over conditions</p></li></ol><p>By checking the code
        constantly, we can be sure that what has been written so far is
        correct.</p>
