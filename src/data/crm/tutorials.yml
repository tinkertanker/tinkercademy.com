    - type: image
      src: /images/remote/a7BwKwoiR5jd7q2m28HRt6da4k.png"http://microbit-micropython.readthedocs.io/en/latest/tutorials/images.html"><a>here</a></a>.</p></li><li><p>Line
        69 displays the score as a string, behind “Score: “</p></li><li><p>Line
        70 ends the while loop so the game ends. This means that it’s ‘game
        over’.</p></li></ul>'
      text: "Step 8 - Collision CoursePhew, you made it to the last step! Ready to
        wing it? Now, we just need to add a collision reaction. This uses a
        get_pixel function that returns the LED brightness value at that
        position. ‘!=‘, the NOT function is also used. Let’s explain how it’s
        used below.Add this collision checking code to the while loop, between
        the bird-drawing and wall-shifting. This means it checks for collision
        before new walls are created so there’s no extra scores by error.As
        shown in line 66, we use an if loop. ‘i.get_pixel(1, led_y) != 0 checks
        if there is a pipe in the position of column 1 (where the bird is),
        specifically at led_y, the displayed position of the bird. If there is a
        pipe pixel in the same position as the bird’s coordinates, the
        i.get_pixel(1, led_y) returns 4, the brightness of the wall. This is NOT
        0 so the function beneath, the collision checker, runsLine 67-68 display
        the in-built sad face image for 0.5s. You can change how long this
        lingers, and to whatever other image you like. Python has a lot of
        images you can input. You can find the entire list here.Line 69 displays
        the score as a string, behind “Score: “Line 70 ends the while loop so
        the game ends. This means that it’s ‘game over’."
    - type: image
      src: /images/remote/kaK1onLpGLCQchtViljGU88xRo.png"http://python.microbit.org/"><a>official micro:bit Python
        editor</a></a> or download the offline Python editor <a
        href="https://codewith.mu/"><a>mu</a></a> to write code and send it to
        your micro:bit. You can also your own text editor (three cheers to
        Sublime 3 and Atom) but you have to flash it to the micro:bit. This
        might turn out to be quite troublesome. Alternatively, you can use a <a
        href="https://create.withcode.uk/"><a>micro:bit simulator</a></a>, which
        is really useful to test code out without downloading the .hex file each
        time, and makes it easier to fix errors.</p><p>Once set up, connect your
        micro:bit to your computer using the micro-USB cable. It should connect
        to the port at the top of the backside of the micro:bit. Once ready to
        be flashed, the micro:bit should light up bright yellow. Ignore this
        step if you’re on the simulator. Otherwise, stop reading and set it up
        if you haven’t already.</p>
      text: How Do I Start Coding in Python?If you’re a fledgling to programming, you
        probably don’t have Python lying around. Don’t worry! Just go to the
