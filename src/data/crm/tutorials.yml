        Python is one of the easiest languages to read, which makes it such a
        fantastic beginner’s language</p></li><li><p>Versatile – Python is
        industry standard for good reason. It can be used to do so much. This is
        why Google and YouTube utilise the language for part of its back-end
        software.</p></li><li><p>Active community – Python is one of the most
        popular languages for beginners. There are tons of resources and many
        more than willing to help look over your code, which will prove
        invaluable to helping you get over stumbling blocks in your coding
        journey.</p></li></ul>
