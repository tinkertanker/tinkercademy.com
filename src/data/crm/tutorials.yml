    - type: image
      src: /images/remote/bdoOFSpHyoQTJBy9vRVeZ08xus.png"Step 0: Code Flow"
      html: "<h1><strong>Step 0: Code Flow</strong></h1><ul><li><p>Before we begin
        writing the code, we need to decide what we want to achieve with the
        program and in what order should each component run.</p></li><li><p>For
        the electric spirit level, the steps that we will take in the code for
        each loop are:</p><ul><li><p>Read tilt readings from
        accelerometer</p></li><li><p>Convert tilt readings to tilt levels to be
        displayed on LED matrix</p></li><li><p>Check for change in tilt level
        readings from previous loop</p></li><li><p>Create array of led
        coordinates for different tilt cases and directions</p></li><li><p>Plot
        led coordinates onto micro:bit LED matrix</p></li></ul></li><li><p>A few
        additional functions we need to include are:</p><ul><li><p>Calibration
        for initial tilt position</p></li><li><p>Returning to default tilt
        calibration</p></li></ul></li></ul>"
      text: "Step 0: Code FlowBefore we begin writing the code, we need to decide what
        we want to achieve with the program and in what order should each
        component run.For the electric spirit level, the steps that we will take
        in the code for each loop are:Read tilt readings from
        accelerometerConvert tilt readings to tilt levels to be displayed on LED
        matrixCheck for change in tilt level readings from previous loopCreate
        array of led coordinates for different tilt cases and directionsPlot led
        coordinates onto micro:bit LED matrixA few additional functions we need
        to include are:Calibration for initial tilt positionReturning to default
        tilt calibration"
    - type: image
      src: /images/remote/HVpA8J3znp9poN5NJRCKnQqYI.png"Step 1: Defining Variables"
      html: "<h1><strong>Step 1: Defining Variables</strong></h1><ul><li><p>We start
        off by defining variables needed as shown. A breakdown of a few of the
        variables are:</p><ul><li><p><strong>tiltList</strong>: Array that
        stores extent of tilt from values 0-4 in the order [Left, Right,
        Forward, Backward]</p></li><li><p><strong>tiltBoundary</strong>:
        Boundary of the first tilt level between 0 (no tilt) and 1 (slight
        tilt)</p></li><li><p><strong>prevState</strong>: Array that stores the
        tilt values of the micro:bit from a previous loop in the same format as
        tiltList, used to check for a change in tilt between
        iterations</p></li><li><p><strong>ledPlotList</strong>: Array of arrays
        of led coordinate to be plotted in the form (x, y). To define an array
        of arrays, we use the type <strong>number[][]</strong> to indicate a
        nested array of variables of type: number.</p></li></ul></li></ul>"
      text: "Step 1: Defining VariablesWe start off by defining variables needed as
        shown. A breakdown of a few of the variables are:tiltList: Array that
        stores extent of tilt from values 0-4 in the order [Left, Right,
        Forward, Backward]tiltBoundary: Boundary of the first tilt level between
        0 (no tilt) and 1 (slight tilt)prevState: Array that stores the tilt
        values of the micro:bit from a previous loop in the same format as
        tiltList, used to check for a change in tilt between
        iterationsledPlotList: Array of arrays of led coordinate to be plotted
        in the form (x, y). To define an array of arrays, we use the type
        number[][] to indicate a nested array of variables of type: number."
    - type: image
      src: /images/remote/JdBF3jASnN8MCFORK9XQdlAWOo.png"Step 2: Convert tilt values to levels"
      html: "<h1><strong>Step 2: Convert tilt values to
        levels</strong></h1><ul><li><p>As the 5×5 LED matrix can only display so
        much information, the actual tilt values will not be useful for
        display</p></li><li><p>Instead, a function
        <strong>tiltExtent()</strong> takes the parameter <strong>num</strong>,
        which refers to the tilt value from the accelerometer, and converts
        these tilt values (<strong>num</strong>) to tilt levels from <strong>0
        to 4. </strong>0 indicates no tilt in the given direction and 4
        indicates very large tilt, while  -1 is returned when there is an
        error.</p></li><li><p>Here, <strong>tiltBoundary</strong> and
        <strong>tiltSensitivity</strong> are used as the boundary values between
        tilt levels.</p></li></ul>"
      text: "Step 2: Convert tilt values to levelsAs the 5×5 LED matrix can only
        display so much information, the actual tilt values will not be useful
        for displayInstead, a function tiltExtent() takes the parameter num,
        which refers to the tilt value from the accelerometer, and converts
        these tilt values (num) to tilt levels from 0 to 4. 0 indicates no tilt
        in the given direction and 4 indicates very large tilt, while -1 is
        returned when there is an error.Here, tiltBoundary and tiltSensitivity
        are used as the boundary values between tilt levels."
    - type: image
      src: /images/remote/R0uIH4DcourhZGaYuXArrQNCnY.png"Step 3: Compile tilt levels"
      html: "<h1><strong>Step 3: Compile tilt levels</strong></h1><ul><li><p>The two
        functions <strong>checkRoll() </strong>and
        <strong>checkPitch() </strong>write the tilt levels obtained from
        <strong>tiltExtent() </strong>into <strong>tiltList</strong> for the
        roll (left-right) and the pitch (forward-backward) axes
        respectively.</p></li><li><p>Before using the tilt values, we calibrate
        them using a zeroed value for both pitch (<strong>zeroPitch</strong>)
        and roll (<strong>zeroRoll</strong>), obtained from a calibration
        function written later.</p></li><li><p>As the accelerometer readings are
        negative for both left and forward tilt, we need to use the
        <strong>Math.abs() </strong>function to obtain the modulus of the
        negative value to be given to the <strong>tiltExtent()</strong> function
        as a parameter for these two directions.</p></li></ul>"
      text: "Step 3: Compile tilt levelsThe two functions checkRoll() and checkPitch()
        write the tilt levels obtained from tiltExtent() into tiltList for the
        roll (left-right) and the pitch (forward-backward) axes
        respectively.Before using the tilt values, we calibrate them using a
        zeroed value for both pitch (zeroPitch) and roll (zeroRoll), obtained
        from a calibration function written later.As the accelerometer readings
        are negative for both left and forward tilt, we need to use the
        Math.abs() function to obtain the modulus of the negative value to be
        given to the tiltExtent() function as a parameter for these two
        directions."
    - type: image
      src: /images/remote/ML8K4E2amVBWQDFDxtfeEyilg.png"Step 4: Write LEDPlotList Functions"
      html: "<h1><strong>Step 4: Write LEDPlotList
        Functions</strong></h1><ul><li><p>Having obtained the tilt levels in
        <strong>tiltList</strong> we can now write the led plotting functions
        for the different cases that can arise,
        namely</p><ul><li><p><strong>plotSingle()</strong>: Tilt only in a
        single direction , taking extent of tilt in given direction as
        parameter</p></li><li><p><strong>plotDiagonal()</strong>: Tilt in two
        directions of the same magnitude, taking extent of tilt in either
        direction as parameter</p></li><li><p><strong>plotUnequal()</strong>:
        Tilt in two directions of different magnitudes, taking extent of tilt in
        each direction as parameter. Uses <strong>plotDiagonal()</strong> first
        and adds on to <strong>ledPlotList</strong> array
        afterwards</p></li></ul></li><li><p>These plotting functions write an
        array of led coordinates to <strong>ledPlotList</strong> to be plotted
        later on.</p></li></ul>"
      text: "Step 4: Write LEDPlotList FunctionsHaving obtained the tilt levels in
        tiltList we can now write the led plotting functions for the different
        cases that can arise, namelyplotSingle(): Tilt only in a single
        direction , taking extent of tilt in given direction as
        parameterplotDiagonal(): Tilt in two directions of the same magnitude,
        taking extent of tilt in either direction as parameterplotUnequal():
        Tilt in two directions of different magnitudes, taking extent of tilt in
        each direction as parameter. Uses plotDiagonal() first and adds on to
        ledPlotList array afterwardsThese plotting functions write an array of
        led coordinates to ledPlotList to be plotted later on."
    - type: image
      src: /images/remote/rYzkwBAivaNvJWyNr8vwE1jKU.png"Step 5: Plot LED Matrix for Each Case"
      html: "<h1><strong>Step 5: Plot LED Matrix for Each
        Case</strong></h1><ul><li><p>Using the plotting functions from the three
        cases in step 4, we can now plot the actual LED matrix for the different
        possible combinations of tilt levels. As the three functions in step 4
        do not discriminate with direction, we need to adjust the coordinate
        values passed to the LED matrix to plot the LEDs in the right
        directions.</p></li><li><p><strong>PlotResult()</strong> contains
        multiple if conditions that check the kind of tilt and plots the LED
        matrix accordingly using <strong>led.plot(x, y)</strong>. The possible
        combinations of tilt are:</p></li><li><p>Single direction: Left Only or
        Right Only</p></li><li><p>Single direction: Forward Only or Backward
        Only</p></li><li><p>Two directions: Forward-left or
        Backward-left</p></li><li><p>Two directions: Forward-right or
        Backward-right</p></li><li><p>Note: For tilt in two directions, each
        combination can have the same or differing magnitude (checked by
        comparing <strong>maxX</strong> and <strong>maxY</strong>), and hence
        plotted using <strong>plotDiagonal()</strong> or
        <strong>plotUnequal()</strong> respectively</p></li></ul>"
      text: "Step 5: Plot LED Matrix for Each CaseUsing the plotting functions from
        the three cases in step 4, we can now plot the actual LED matrix for the
        different possible combinations of tilt levels. As the three functions
        in step 4 do not discriminate with direction, we need to adjust the
        coordinate values passed to the LED matrix to plot the LEDs in the right
        directions.PlotResult() contains multiple if conditions that check the
        kind of tilt and plots the LED matrix accordingly using led.plot(x, y).
        The possible combinations of tilt are:Single direction: Left Only or
        Right OnlySingle direction: Forward Only or Backward OnlyTwo directions:
        Forward-left or Backward-leftTwo directions: Forward-right or
        Backward-rightNote: For tilt in two directions, each combination can
        have the same or differing magnitude (checked by comparing maxX and
        maxY), and hence plotted using plotDiagonal() or plotUnequal()
        respectively"
    - type: image
      src: /images/remote/k7CUSyQYMQiHAl0o044tUEkoBtg.png"Step 6: Write Calibration Functions"
      html: "<h1><strong>Step 6: Write Calibration
        Functions</strong></h1><ul><li><p>Having completed the bulk of the code,
        we now add in the <strong>calibTilt()</strong> and
        the <strong>resetTilt() </strong>functions.</p><ul><li><p><strong>calib\
        Tilt()</strong> allows users to tare the tilt to zero at the micro:bit’s
        current position</p></li><li><p><strong>resetTilt()</strong> resets the
        calibration of the board to its original state</p></li></ul></li></ul>"
      text: "Step 6: Write Calibration FunctionsHaving completed the bulk of the code,
        we now add in the calibTilt() and the resetTilt() functions.calibTilt()
        allows users to tare the tilt to zero at the micro:bit’s current
        positionresetTilt() resets the calibration of the board to its original
        state"
    - type: image
      src: /images/remote/RKkN6U0eCLu2U5TbrUdH9dVY.png"Step 7: Write State Function"
      html: "<h1><strong>Step 7: Write State Function</strong></h1><ul><li><p>We add a
        simple function <strong>checkState() </strong>to check whether the tilt
        levels have changed from a previous iteration.</p></li><li><p>If there
        is no change in tilt levels from a previous iteration i.e.
        <strong>stateChange == 0</strong>, we can directly move on to the next
        iteration and skip the plotting of the LED matrix, reducing computation
        needed.</p></li></ul>"
      text: "Step 7: Write State FunctionWe add a simple function checkState() to
        check whether the tilt levels have changed from a previous iteration.If
        there is no change in tilt levels from a previous iteration i.e.
        stateChange == 0, we can directly move on to the next iteration and skip
        the plotting of the LED matrix, reducing computation needed."
    - type: richtext
      label: "Step 8: Putting it All Together Part 1!"
      html: "<h1><strong>Step 8: Putting it All Together Part
        1!</strong></h1><ul><li><p>Now we can finally place all the necessary
        functions into the micro:bit’s infinite loop to have it run
        repeatedly.</p></li><li><p>We first  set the buttons A and B on the
        micro:bit to the <strong>calibTilt()</strong> and
        <strong>resetTilt()</strong> functions respectively using
        <strong>input.onButtonPressed()</strong>, and plot a tick on the LED
        matrix when the calibration is complete.</p></li></ul>"
      text: "Step 8: Putting it All Together Part 1!Now we can finally place all the
        necessary functions into the micro:bit’s infinite loop to have it run
        repeatedly.We first set the buttons A and B on the micro:bit to the
        calibTilt() and resetTilt() functions respectively using
        input.onButtonPressed(), and plot a tick on the LED matrix when the
        calibration is complete."
    - type: image
      src: /images/remote/pVn7HcF0ERXroPsrMxt0fssv4.png"Step 9: Putting it All Together Part 2!"
      html: "<h1><strong>Step 9: Putting it All Together Part
        2!</strong></h1><ul><li><p>We then run the necessary functions according
        to our code flow in <strong>Step 0 </strong>and check for a state change
        (meaning that there has been a change in the tilt of the micro:bit since
        the last iteration).</p></li><li><p>If there is a change in tilt levels
        i.e. <strong>stateChange == 1</strong>, the code will update
        <strong>prevState</strong> to the new tilt levels and set
        <strong>stateChange</strong> back to 0 for the next iteration, and plot
        the updated tilt levels on the LED matrix using
        <strong>PlotResult()</strong>.</p></li></ul>"
      text: "Step 9: Putting it All Together Part 2!We then run the necessary
        functions according to our code flow in Step 0 and check for a state
        change (meaning that there has been a change in the tilt of the
        micro:bit since the last iteration).If there is a change in tilt levels
        i.e. stateChange == 1, the code will update prevState to the new tilt
        levels and set stateChange back to 0 for the next iteration, and plot
        the updated tilt levels on the LED matrix using PlotResult()."
    - type: image
      src: /images/remote/CKeGoJOZaVnNVERr6e0RGmKEfpI.png"Step 10: Assembly"
      html: '<h1><strong><br />Step 10: Assembly</strong></h1><ul><li><p>Flash the
        completed code to your micro:bit (instructions <a
